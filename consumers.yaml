# Repositories that run this one. They call it `@main` and take every release
# on their next run. On a release, .github/workflows/release.yml still opens a
# pull request in any of them that pins a commit instead
# (scripts/bump_consumers.sh); one on `@main` has no pin and is skipped.
consumers:
  - {repo: MicroHealthLLC/TueriCore, branch: integration}
  - {repo: MicroHealthLLC/TueriCXO, branch: integration}
  - {repo: MicroHealthLLC/e-aar, branch: Integration}
  - {repo: MicroHealthLLC/fips-container, branch: integration}
  - {repo: MicroHealthLLC/fluenta, branch: integration}
  - {repo: MicroHealthLLC/gnosis, branch: integration}
  - {repo: MicroHealthLLC/simplr-ehr, branch: Integration}
  - {repo: MicroHealthLLC/TueriDev, branch: Integration}
  - {repo: MicroHealthLLC/TueriTerm, branch: integration}
  - {repo: MicroHealthLLC/mh-vllm, branch: integration}
  - {repo: MicroHealthLLC/SimplrSSH, branch: integration}
  - {repo: MicroHealthLLC/esp32-p4-webradio, branch: integration}
  - {repo: MicroHealthLLC/kb-saas, branch: integration}
