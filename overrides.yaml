# Rules we turn off or re-grade. Every entry carries its reason: a suppression
# without a reason is a lie a security tool tells itself. Upstream files are
# never edited; the override is applied when the bundles are built, and the
# lock file keeps the rule listed as `disabled` with this reason.
#
# disabled:
#   mh.gitlab.some-rule-id: "what was assessed and why it does not apply"
# severity:
#   mh.opengrep.some.rule: {to: WARNING, reason: "why"}
disabled:
  # --- Code scan of TueriCore, 2026-10-13: false-positive classes proven on real code ---
  mh.opengrep.dockerfile.security.last-user-is-root.last-user-is-root: "superseded by mh.microhealth.dockerfile.last-user-root: more precise; the original flags USER root in every build stage, but only the last stage is the image that runs. On TueriCore it reported 10 lines, 7 of them throwaway builder stages (apk add before a COPY --from); the replacement flags the final stage only, and keeps a final USER root unless the line carries a reviewed hadolint DL3002 ignore or the stage drops privileges itself (tests)."
  mh.opengrep.go.lang.security.audit.unsafe.use-of-unsafe-block: "superseded by mh.microhealth.go.unsafe-pointer-misuse: more precise; the original matches every unsafe.X(...) call, including unsafe.Sizeof (a compile-time constant) and uintptr(unsafe.Pointer(x)) written in a syscall/Proc.Call argument list, the pattern unsafe.Pointer's documentation gives as the valid way to call the Windows API. On TueriCore's agent it reported 48 lines, 43 of them that pattern; the replacement reports the 5 that need review (unsafe.Slice over OS buffers, a pointer conversion) and keeps uintptr arithmetic and nested unsafe.Add (tests)."
  mh.gitlab.go_unsafe_rule-unsafe: "superseded by mh.microhealth.go.unsafe-pointer-misuse: same reason as mh.opengrep.go.lang.security.audit.unsafe.use-of-unsafe-block, which this gosec rule duplicates (44 of the same 48 lines on TueriCore's agent); the MIT replacement also enters the product bundle, so product coverage is kept."
  mh.gitlab.go_file-permissions_rule-fileperm: "superseded by mh.microhealth.go.file-mode-too-permissive: more precise; the original compares the mode as a number (int($MASK) > 0o640), so 0o700 (owner only) is reported and 0o604 (world-readable) is not. Same 0640 threshold, tested as bits (mode & 0o037). On TueriCore it reported 0o700 files in agent-go enroll.go and runner-go executor.go."
  mh.gitlab.go_file-permissions_rule-mkdir: "superseded by mh.microhealth.go.dir-mode-too-permissive: more precise; the original compares the mode as a number ($MASK > 0o750), which is not a permission order. Same 0750 threshold, tested as bits (mode & 0o027); 0755 and setgid 2770 are still reported (tests)."
  mh.gitlab.go_sql_rule-concat-sqli: "superseded by mh.microhealth.go.sql-built-from-strings: more precise; the original's source is any fmt.Sprintf or string concatenation and its sink any $X.Exec/Query call, so TueriCore's process launcher access.Exec(ctx, \"launchctl\", \"bootout\", \"system/\"+label) was reported as SQL injection. The replacement keeps the same sinks (plus Prepare) and strings.Builder, and treats a formatted or concatenated string as a source when its literal part reads as SQL. Trade-off: a format string with no SQL keyword at all (\"%s\") is no longer a source."
  mh.opengrep.go.lang.security.decompression_bomb.potential-dos-via-decompression-bomb: "superseded by mh.microhealth.go.decompression-without-limit: the original's io.LimitReader sanitizer focuses on the argument inside the call, so the call's result stays tainted and io.Copy(f, io.LimitReader(tr, n)) -- the fix its own message asks for -- is reported (verified on TueriCore's code/runner-go actions.go). The replacement sanitizes the bounded reader itself and adds io.ReadAll as a sink."
  mh.gitlab.go_filesystem_rule-decompression-bomb: "superseded by mh.microhealth.go.decompression-without-limit: same sanitizer defect as mh.opengrep.go.lang.security.decompression_bomb.potential-dos-via-decompression-bomb, which this rule duplicates line for line."
severity: {}
