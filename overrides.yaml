  mh.opengrep.generic.secrets.gitleaks.generic-api-key.generic-api-key: "Replaced by mh.microhealth.generic.secrets.generic-api-key: OAuth client identifiers (client_id-named values, GitHub's Ov23li/Iv23li/Iv1. formats) are public by definition (RFC 6749 2.2) and no longer match; everything else is unchanged."
  mh.opengrep.generic.secrets.gitleaks.private-key.private-key: "Replaced by mh.microhealth.generic.secrets.private-key: a PEM armour whose only body is a template interpolation (${...}) is code that encodes a run-time key, not key material; the body is also matched lazily so each block is its own finding."
  mh.opengrep.generic.secrets.security.detected-telegram-bot-api-key.detected-telegram-bot-api-key: "Replaced by mh.microhealth.generic.secrets.telegram-bot-api-key: the token now needs a boundary on both sides; the original matched '256:AAAA...' inside SSH fingerprints 'SHA256:AAAA...'."
  mh.opengrep.html.security.audit.missing-integrity.missing-integrity: "Replaced by mh.microhealth.html.missing-integrity: only URLs that start with scheme:// or // count as externally hosted; the original matched '://' anywhere in the value, e.g. inside an inline data: URI."
  mh.opengrep.json.npm.security.package-dependencies-check.package-dependencies-check: "Replaced by mh.microhealth.json.npm.package-dependencies-check: the value is judged as an npm spec, so exact versions, file:/link:/workspace: paths, npm: aliases to an exact version and pinned .tgz tarball URLs no longer fire (upstream matched any '-' or 'x'), while ranges, wildcards, partial versions, dist-tags and unpinned git specs do, scoped packages included."
  mh.opengrep.generic.secrets.gitleaks.aws-access-token.aws-access-token: >-
    Reported every AWS key ID a second time beside
    detected-aws-access-key-id-value, and reported AWS's own documentation
    example (AKIAIOSFODNN7EXAMPLE), which gitleaks itself allow-lists (12 hits
    in e-aar, all test fixtures). Replaced, together with the rule below, by
    mh.microhealth.generic.aws-access-key-id: the union of both prefix lists,
    exempting only an ID that ends in EXAMPLE, which IAM never issues.
  mh.opengrep.generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value: >-
    Duplicate of gitleaks.aws-access-token (the same key IDs, reported twice)
    and its exemption was too wide: it dropped any ID containing TEST, FAKE or
    SAMPLE, which a real random key ID can contain. Replaced by
    mh.microhealth.generic.aws-access-key-id (see above).
  mh.opengrep.javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket: >-
    A `regex` rule over every file, so `ws://` in a comment, a JSDoc block or
    Markdown prose was a HIGH finding (2 of 2 in e-aar: an ADR and a
    vite.config.ts comment explaining why the dev server's HMR uses ws://).
    Replaced by mh.microhealth.javascript.insecure-websocket-url, which reads
    JavaScript/TypeScript string and template literals only and keeps the
    upstream loopback exemption.
  mh.gitlab.rules_lgpl_javascript_crypto_rule-node-insecure-random-generator: >-
    Reported every Math.random() whatever it was for (2 of 2 in e-aar: retry
    jitter and a skeleton loader's width). Predicting those gives an attacker
    nothing. Replaced by mh.microhealth.javascript.insecure-random-for-secret:
    Math.random() whose result is bound to, or returned by, a name that says
    it must not be guessed (token, secret, nonce, salt, session, key, ...),
    and crypto.pseudoRandomBytes() wherever it appears.
  mh.opengrep.javascript.browser.security.open-redirect-from-function.js-open-redirect-from-function: >-
    Its taint source is any parameter of any function, so a click handler
    building `${config.edgeFunctionUrl}/…?id=${row.id}` was an open redirect
    (2 of 2 in Gnosis, both a fixed origin). Replaced by
    mh.microhealth.javascript.open-redirect-from-url-input: the query
    string, fragment, referrer or window.name reaching a navigation.
  mh.opengrep.terraform.lang.security.iam.no-iam-data-exfiltration.no-iam-data-exfiltration: >-
    Checks whether ANY statement of a policy has `Resource = "*"`, then
    reports the data actions of EVERY statement, so a GetSecretValue scoped
    to named secret ARNs was reported because another statement granted
    ecr:GetAuthorizationToken (which AWS only accepts on "*"). Replaced by
    mh.microhealth.terraform.iam-data-read-unscoped, which reads the action
    and the resource from the same statement.
  mh.gitlab.python_xml_rule-element: >-
    Reports every xml.etree.ElementTree parse. The Python documentation's
    XML-vulnerability table lists ElementTree as not vulnerable to external
    entity expansion, and, with expat 2.4.1 or later (every supported
    Python build, including the FIPS Python images), not vulnerable to
    billion-laughs or quadratic blow-up either; defusedxml, which the rule
    recommends, documents the same. The parsers that remain unsafe (lxml
    with entity resolution, xmlrpc decompression) have their own rules.
  # --- Code scan of TueriCore, 2026-10-13: false-positive classes proven on real code ---
  mh.opengrep.dockerfile.security.last-user-is-root.last-user-is-root: "superseded by mh.microhealth.dockerfile.last-user-root: more precise; the original flags USER root in every build stage, but only the last stage is the image that runs. On TueriCore it reported 10 lines, 7 of them throwaway builder stages (apk add before a COPY --from); the replacement flags the final stage only, and keeps a final USER root unless the line carries a reviewed hadolint DL3002 ignore or the stage drops privileges itself (tests)."
  mh.opengrep.go.lang.security.audit.unsafe.use-of-unsafe-block: "superseded by mh.microhealth.go.unsafe-pointer-misuse: more precise; the original matches every unsafe.X(...) call, including unsafe.Sizeof (a compile-time constant) and uintptr(unsafe.Pointer(x)) written in a syscall/Proc.Call argument list, the pattern unsafe.Pointer's documentation gives as the valid way to call the Windows API. On TueriCore's agent it reported 48 lines, 43 of them that pattern; the replacement reports the 5 that need review (unsafe.Slice over OS buffers, a pointer conversion) and keeps uintptr arithmetic and nested unsafe.Add (tests)."
  mh.gitlab.go_unsafe_rule-unsafe: "superseded by mh.microhealth.go.unsafe-pointer-misuse: same reason as mh.opengrep.go.lang.security.audit.unsafe.use-of-unsafe-block, which this gosec rule duplicates (44 of the same 48 lines on TueriCore's agent); the MIT replacement also enters the product bundle, so product coverage is kept."
  mh.gitlab.go_file-permissions_rule-fileperm: "superseded by mh.microhealth.go.file-mode-too-permissive: more precise; the original compares the mode as a number (int($MASK) > 0o640), so 0o700 (owner only) is reported and 0o604 (world-readable) is not. Same 0640 threshold, tested as bits (mode & 0o037). On TueriCore it reported 0o700 files in agent-go enroll.go and runner-go executor.go."
  mh.gitlab.go_file-permissions_rule-mkdir: "superseded by mh.microhealth.go.dir-mode-too-permissive: more precise; the original compares the mode as a number ($MASK > 0o750), which is not a permission order. Same 0750 threshold, tested as bits (mode & 0o027); 0755 and setgid 2770 are still reported (tests)."
  mh.gitlab.go_sql_rule-concat-sqli: "superseded by mh.microhealth.go.sql-built-from-strings: more precise; the original's source is any fmt.Sprintf or string concatenation and its sink any $X.Exec/Query call, so TueriCore's process launcher access.Exec(ctx, \"launchctl\", \"bootout\", \"system/\"+label) was reported as SQL injection. The replacement keeps the same sinks (plus Prepare) and strings.Builder, and treats a formatted or concatenated string as a source when its literal part reads as SQL. Trade-off: a format string with no SQL keyword at all (\"%s\") is no longer a source."
  mh.opengrep.go.lang.security.decompression_bomb.potential-dos-via-decompression-bomb: "superseded by mh.microhealth.go.decompression-without-limit: the original's io.LimitReader sanitizer focuses on the argument inside the call, so the call's result stays tainted and io.Copy(f, io.LimitReader(tr, n)) -- the fix its own message asks for -- is reported (verified on TueriCore's code/runner-go actions.go). The replacement sanitizes the bounded reader itself and adds io.ReadAll as a sink."
  mh.gitlab.go_filesystem_rule-decompression-bomb: "superseded by mh.microhealth.go.decompression-without-limit: same sanitizer defect as mh.opengrep.go.lang.security.decompression_bomb.potential-dos-via-decompression-bomb, which this rule duplicates line for line."
  mh.opengrep.python.flask.security.audit.directly-returned-format-string.directly-returned-format-string: "superseded by mh.microhealth.python.flask-returned-format-string: more precise; the original's sources (request.X.get(...)) and sinks (a formatted return) apply in every Python file, so TueriCore's FastAPI helpers that build a base URL from a header and return it into a JSON body (routers/cr26_reports.py, routers/oauth.py) were reported as Flask XSS. A returned string is an HTML response only in Flask; the replacement keeps the same sources and sinks in files that import Flask (verified: it still reports both Flask cases and not the FastAPI helper)."
  # --- Superseded by request-taint and narrower MicroHealth JavaScript/JSON rules (2026-10-13; findings sampled on TueriDev, every replacement tested with ruleid/ok cases) ---
  mh.gitlab.javascript_pathtraversal_rule-non-literal-fs-filename: "superseded by mh.microhealth.javascript.path-traversal-from-request: more precise; the original reports every fs call whose path is not a string literal, so a file the program computes inside its own data folder is \"path traversal\"; 821 findings in TueriDev, none reachable from a client. The replacement is taint from request fields and WebSocket messages to the fs call, with basename and containment checks as sanitizers."
  mh.opengrep.javascript.lang.security.audit.detect-non-literal-fs-filename.detect-non-literal-fs-filename: "superseded by mh.microhealth.javascript.path-traversal-from-request: more precise; the original the same \"any non-literal path\" audit as the GitLab rule (152 findings in TueriDev, none from a client); the replacement needs a value a client sent."
  mh.opengrep.javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal: "superseded by mh.microhealth.javascript.path-traversal-from-request: more precise; the original treats every function parameter as attacker input and every path.join/resolve as a sink, with no file access needed (212 findings in TueriDev, e.g. path.join(homedir, \".local\", \"bin\")); the replacement needs request input to reach a file system call."
  mh.opengrep.javascript.lang.security.detect-child-process.detect-child-process: "superseded by mh.microhealth.javascript.child-process-shell-command: more precise; the original reports every exec/spawn whose program is a function parameter, including spawn(file, argv, { shell: false }) -- the form its own message recommends, where there is no shell to inject into. The replacement reports what makes a command injectable: a non-constant command line run through a shell (exec/execSync, or spawn/execFile with `shell` set)."
  mh.opengrep.problem-based-packs.insecure-transport.js-node.using-http-server.using-http-server: "superseded by mh.microhealth.javascript.http-server-non-loopback: more precise; the original reports any `http.<anything>(...)` call, including the loopback redirect server RFC 8252 section 7.3 REQUIRES of a native OAuth client; the replacement reports an http server that does not listen on 127.0.0.1, localhost or ::1."
  mh.opengrep.javascript.lang.security.audit.unsafe-dynamic-method.unsafe-dynamic-method: "superseded by mh.microhealth.javascript.dynamic-method-from-request: more precise; the original reports every obj[key](...) with a non-literal key -- dispatch tables keyed by the program's own command names, toast levels, language loaders (20 in TueriDev); the replacement needs the key to come from a request, with Object.hasOwn / Set.has / includes as sanitizers."
  mh.opengrep.javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization: "superseded by mh.microhealth.javascript.incomplete-escape-replace: more precise; the original reports a one-character string replace() of `%`, `|`, `*`, `$`, brackets or quotes whatever it is for, so stripping the `%` from \"50%\" was \"incomplete sanitization\"; the replacement needs an escapable character (<, >, &, quotes, backslash) replaced by its escape."
  mh.gitlab.rules_lgpl_javascript_eval_rule-yaml-deserialize: "superseded by mh.microhealth.javascript.js-yaml-unsafe-schema and mh.microhealth.json.npm-js-yaml-v3: more precise; the original reports every js-yaml load() as remote code execution (ERROR). Since js-yaml 4 (2021) load() uses the safe default schema and cannot build functions; the danger is a v3 install (json.npm-js-yaml-v3) or a schema that adds the JavaScript types back (javascript.js-yaml-unsafe-schema)."
  # --- Code scan of Fluenta, 2026-10-14 ---
  mh.opengrep.javascript.express.security.injection.tainted-sql-string.tainted-sql-string: >-
    Its sink is any string whose literal part contains a SQL keyword as a
    word, so error messages and log lines (`Failed to create folder:
    ${errorText}`, `attachment row insert failed for ${att.filename}`) were
    SQL injection: 8 of 8 hits in Fluenta. A taint rule cannot be refined, so
    it is replaced by mh.microhealth.javascript.express-tainted-sql-string:
    the same sources, keyword test and sinks, except a string built inside a
    throw, new Error, console.* or a logger/log* call, which is shown to a
    person and never run as SQL.
severity: {}
refine:
  mh.opengrep.generic.secrets.gitleaks.stripe-access-token.stripe-access-token:
    reason: >-
      Reports the documentation placeholder `sk_live_xxxxxxxxxxxxxxxx` (3
      hits in Gnosis's API reference). A key body made only of x, 0 or *
      is a placeholder; generic-api-key already skips such runs. Any key
      with real characters is still reported.
    add:
      - pattern-not-regex: (?i)\b(?:sk|rk)_(?:test|live|prod)_(?:x+|0+|\*+)\b
  mh.opengrep.yaml.kubernetes.security.run-as-non-root-security-context-pod-level.run-as-non-root-security-context-pod-level:
    reason: >-
      Its "already set" check only recognises a pod securityContext whose
      sole key is runAsNonRoot, so `securityContext: {runAsNonRoot: true,
      runAsUser: 10001, …}` was reported as missing it (2 of 2 in Gnosis's
      k8s manifests). This accepts runAsNonRoot among other keys.
    add:
      - pattern-not-inside: |
          spec:
            ...
            securityContext:
              ...
              runAsNonRoot: true
              ...
            ...
  mh.opengrep.terraform.aws.security.aws-ec2-security-group-allows-public-ingress.aws-ec2-security-group-allows-public-ingress:
    reason: >-
      A public web endpoint (an internet-facing load balancer) has to accept
      ports 80 and 443 from anywhere; that is its design, not a finding (2
      of 2 in Gnosis: the ALB's HTTP-redirect and HTTPS listeners). Any
      other port open to the internet (SSH, a database, a range) is still
      reported.
    add:
      - pattern-not: |
          ingress {
            ...
            from_port = 443
            ...
            to_port = 443
            ...
          }
      - pattern-not: |
          ingress {
            ...
            from_port = 80
            ...
            to_port = 80
            ...
          }
  mh.opengrep.terraform.lang.security.iam.no-iam-creds-exposure.no-iam-creds-exposure:
    reason: >-
      ecr:GetAuthorizationToken returns a registry login that carries only
      the caller's own ECR permissions (it grants nothing the role cannot
      already do), and AWS accepts it only on Resource "*". Every ECS task
      execution role that pulls from ECR needs it (it is in AWS's managed
      AmazonECSTaskExecutionRolePolicy). A statement whose only action it
      is is no longer reported; every other credential action still is.
    add:
      - pattern-not: Action = "ecr:GetAuthorizationToken"
      - pattern-not: Action = ["ecr:GetAuthorizationToken"]
      - pattern-not: actions = ["ecr:GetAuthorizationToken"]
  mh.opengrep.python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query:
    reason: >-
      Its `$SQL.format(...)` and `$SQL + ...` patterns also match psycopg's
      safe composition API, `cur.execute(sql.SQL("DROP SCHEMA IF EXISTS {}
      CASCADE").format(sql.Identifier(s)))`, where `format` quotes each
      sql.Identifier/sql.Literal argument and the template is a constant (22
      of 24 hits in Fluenta's database tooling, directly or through an
      assigned `stmt = pgsql.SQL(...).format(...)`). A LITERAL template passed
      through any module alias's `.SQL("...")` and composed with `.format` or
      `+` is no longer reported, executed directly or through the variable it
      was assigned to. A template built from a variable (`sql.SQL('CREATE
      ROLE {} ' + opts)`), %-formatting, str.format and f-strings are still
      reported. Known ceiling: a raw `sql.SQL(variable)` passed as a format
      ARGUMENT, and a raw execute placed between such an assignment and the
      execute of that variable, are not told apart from the safe form.
    add:
      - pattern-not: $C.execute($M.SQL("...").format(...), ...)
      - pattern-not: $C.execute($M.SQL("...") + ..., ...)
      - pattern-not-inside: |
          $QUERY = $M.SQL("...").format(...)
          ...
          $CONNECTION.execute($QUERY, ...)
      - pattern-not-inside: |
          $QUERY = $M.SQL("...") + ...
          ...
          $CONNECTION.execute($QUERY, ...)
  mh.opengrep.generic.secrets.gitleaks.hashicorp-tf-password.hashicorp-tf-password:
    reason: >-
      Reports the NAME of a secret, not its value: Terraform's azurerm
      `registry { password_secret_name = "acr-password" }` names the Container
      App secret that holds the password (6 hits in Fluenta), and
      `ECR_PASSWORD_VAR = "RAILWAY_ECR_PASSWORD"` names the environment
      variable that does (1 hit). A password-named key ending in
      _secret_name/_name/_var/_env, or a password-named key whose value is an
      ALL-CAPS identifier with an underscore (an environment variable name),
      is no longer reported. Every other quoted password value still is (e.g.
      `administrator_login_password = "Sup3rS3cret99"`). The upstream regex
      never matched a value containing `!` or `@`, so
      `"Fluenta@Admin2026!"` was not reported before this change either.
    add:
      - pattern-not-regex: (?m)^[^\n]*?\b\w*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\w*?(?:_secret_name|_SECRET_NAME|_name|_NAME|_var|_VAR|_env|_ENV)["']?[ \t]*(?:=|:)[ \t]*(?:"[^"\n]*"|'[^'\n]*')[^\n]*\n?|(?m)^[^\n]*?\b\w*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]\w*["']?[ \t]*(?:=|:)[ \t]*(["'])[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+\1[^\n]*\n?
  mh.opengrep.generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling:
    reason: >-
      h2c smuggling needs the client's `Upgrade: h2c` to reach the upstream.
      A location that pins the header to a constant (`proxy_set_header
      Upgrade '';`, which drops it, or `proxy_set_header Upgrade websocket;`,
      the rule's own recommended fix) never forwards the client's value, yet
      was reported because it sets Upgrade and Connection with HTTP/1.1 (2
      of 2 hits in Fluenta: deploy/nginx and deploy/railway/nginx
      default.conf).
      Such a location is no longer reported; `proxy_set_header Upgrade
      $http_upgrade;` (or any other variable) still is.
    add:
      - pattern-not-regex: (?i)proxy_set_header\s+Upgrade\s+(?:''|""|(["']?)websocket\1)\s*;
allow:
  - rules: [mh.opengrep.generic.secrets.*, mh.microhealth.generic.*]
    not-regex: '(?m)^.*\bgitleaks:allow\b.*$'
    reason: >-
      `gitleaks:allow` on the line is gitleaks' own inline allow, and these
      rules are its ported patterns (gitleaks/), the same idea (security/), or
      MicroHealth replacements of either (mh.microhealth.generic.*).
      Repositories mark reviewed test fixtures with it for the gitleaks job in
      their CI; without this, the same fixture is allowed by one scanner and
      a CRITICAL finding in the other. The marker is visible in review and in
      the diff that adds it, as `nosemgrep` is.
