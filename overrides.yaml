# Rules we turn off or re-grade. Every entry carries its reason: a suppression
# without a reason is a lie a security tool tells itself. Upstream files are
# never edited; the override is applied when the bundles are built, and the
# lock file keeps the rule listed as `disabled` with this reason.
#
# disabled:
#   mh.gitlab.some-rule-id: "what was assessed and why it does not apply"
# severity:
#   mh.opengrep.some.rule: {to: WARNING, reason: "why"}
disabled:
  mh.opengrep.generic.secrets.security.detected-aws-account-id.detected-aws-account-id: >-
    An AWS account ID is an identifier, not a credential (AWS: "account IDs
    are not considered secret"); access needs credentials this rule never
    sees. It fired on every pinned MicroHealth FIPS image reference
    (295669632222.dkr.ecr...), 87 times in Tueri Core alone, burying real
    findings. Secret keys are still caught by the AWS access-key and secret
    rules in both upstream sources and by Trivy's secret scanner.
#   mh.gitlab.some-rule-id: "what was assessed and why it does not apply"
# severity:
#   mh.opengrep.some.rule: {to: WARNING, reason: "why"}
disabled:
  mh.opengrep.generic.secrets.security.detected-google-gcm-service-account.detected-google-gcm-service-account: >-
    Matched the `"type": "service_account"` marker alone, so it reported form
    placeholders and documentation that show the shape of a key file (3 of 3
    hits in TueriCXO, all UI placeholders). The marker is not a credential;
    the private key is. Replaced by mh.microhealth.generic.gcp-service-account-key,
    which requires the marker AND a private key with key material in the same
    file. A bare PEM private key is still caught by the private-key rules of
    both upstream sources and by Trivy.
  mh.opengrep.generic.secrets.security.detected-jwt-token.detected-jwt-token: >-
    Replaced by mh.microhealth.generic.jwt-token. This rule and gitleaks.jwt
    reported every token twice, and both reported the public Supabase ANON key
    (role=anon, shipped to every browser by design) in migrations that can
    never be edited (9 + 9 hits in TueriCXO, all anon keys). The replacement
    keeps the same token shape and exempts only a payload whose fixed claims
    are iss=supabase and role=anon; a service_role key or any other token is
    still reported.
  mh.opengrep.generic.secrets.gitleaks.jwt.jwt: >-
    Duplicate of detected-jwt-token (the same tokens, reported twice);
    replaced with it by mh.microhealth.generic.jwt-token (see above).
  mh.opengrep.javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring: >-
    Reports any template literal passed as the first argument of console.*
    when more arguments follow (2,279 hits in TueriCXO, every one a
    console.log/warn/error). The harm it describes is that a `%s` inside the
    interpolated value makes console substitute a later argument into the
    line: the text of a log line changes, nothing executes, and the value was
    attacker-chosen log text already. Log injection proper (newlines, terminal
    escapes) is not what it detects either, so it carries no security signal
    and buried every real finding in the report.
  mh.opengrep.javascript.lang.security.html-in-template-string.html-in-template-string: >-
    Reports every template literal that contains `<...>` and an
    interpolation: XML, SVG and PDF writers, LLM prompts, YAML comments,
    regex sources, CLI usage text. It ignores whether each value is escaped
    and whether the string is ever parsed as HTML (85 hits in TueriCXO, 84
    false). Replaced by mh.microhealth.javascript.html-string-to-dom-sink,
    which follows interpolated values to the sinks that parse HTML
    (innerHTML, outerHTML, insertAdjacentHTML, document.write, srcdoc) and
    treats escaping helpers and DOMPurify as sanitisers; it finds the one
    real case (a document.write of unescaped vendor and model text).
  mh.gitlab.javascript_react_rule-dangerouslysetinnerhtml: >-
    Reports every dangerouslySetInnerHTML, including values produced by
    DOMPurify in the same component (10 of 10 sanitised in TueriCXO).
    Replaced by mh.microhealth.javascript.react-unsanitized-inner-html, which
    reports only a value whose sanitiser call is not visible at the attribute
    or in the const it reads.
  mh.opengrep.typescript.react.security.audit.react-dangerouslysetinnerhtml.react-dangerouslysetinnerhtml: >-
    Same finding as mh.gitlab.javascript_react_rule-dangerouslysetinnerhtml
    (reported twice); replaced with it by
    mh.microhealth.javascript.react-unsanitized-inner-html.
  mh.opengrep.javascript.express.security.audit.express-res-sendfile.express-res-sendfile: >-
    Its sources include ANY function parameter typed `string`, and its sink
    is any method named sendFile on any object, so a storage client's own
    `sendFile(path: string)` upload method was reported as Express (6 of 6 in
    TueriCXO). Replaced by mh.microhealth.javascript.express-sendfile-request-path:
    request data to an Express response's sendFile/download without `root`.
  mh.gitlab.javascript_timing_rule-possible-timing-attacks: >-
    Also reports a secret-named variable compared with a literal (`if (token
    === "") continue;` while splitting a list), which reveals nothing about
    any secret. Replaced by mh.microhealth.javascript.secret-compare-not-constant-time:
    a secret compared with a value that is neither a literal nor another
    secret we hold, in any expression (not only `if`).
  mh.opengrep.java.android.security.exported_activity.exported_activity: >-
    Reports the app's MAIN/LAUNCHER activity, which Android 12+ requires to
    be exported, so every Android/Capacitor app carried a finding it could
    not fix. Replaced by mh.microhealth.android.exported-activity, which
    exempts only an activity whose sole intent filter is MAIN + LAUNCHER.
  mh.opengrep.bash.lang.security.ifs-tampering.ifs-tampering: >-
    Reports every `IFS=`, including the scoped forms its own message
    recommends (inside `$( … )`, a subshell, or after `local IFS`).
    Replaced by mh.microhealth.bash.ifs-global.
  mh.opengrep.generic.nginx.security.missing-internal.missing-internal: >-
    Reports every proxy_pass to a variable without `internal`, including
    `set $upstream "<configured origin>"; proxy_pass $upstream;`, whose
    variable comes from configuration (it only makes nginx re-resolve DNS);
    `internal` would break a public reverse proxy. Replaced by
    mh.microhealth.nginx.proxy-pass-request-variable, which reports a
    client-controlled variable in the destination's scheme or authority.
  mh.opengrep.generic.nginx.security.request-host-used.request-host-used: >-
    Reports every `$host` / `$http_host`, including `proxy_set_header Host
    $host`, which only forwards the request's own Host upstream. Replaced by
    mh.microhealth.nginx.host-header-in-response: Host reflected in a
    redirect, header or Location this server sends.
  mh.opengrep.javascript.lang.security.insecure-object-assign.insecure-object-assign: >-
    Its sink is every argument of Object.assign, including the TARGET, so
    writing a literal of fixed keys into a parsed object was "prototype
    pollution". Replaced by mh.microhealth.javascript.json-parse-into-object-assign:
    parsed JSON as a source argument, schema-validated values excluded.
  mh.opengrep.yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command: >-
    Its pattern is the literal text `::add-mask::`, so it reports every
    masking command however its value is produced, and the only way to
    satisfy it is to stop masking secrets. Replaced by
    mh.microhealth.yaml.github-actions-add-mask-expression: a `${{ … }}`
    expression interpolated into the command, the case that can inject.
  mh.gitlab.javascript_dos_rule-non-literal-regexp: >-
    Reports every RegExp built from anything but a literal, including module
    constants and values already escaped (30 hits in TueriCXO, none a
    user-written pattern). Replaced, together with detect-non-literal-regexp,
    by mh.microhealth.javascript.regexp-from-untrusted-input: request, URL
    and form input compiled into a RegExp without escaping.
  mh.opengrep.javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp: >-
    Its taint source is "any parameter of any function", so a helper
    called only with constant tag names was user input (22 hits in TueriCXO,
    all false). Replaced by mh.microhealth.javascript.regexp-from-untrusted-input
    (see above).
severity: {}
