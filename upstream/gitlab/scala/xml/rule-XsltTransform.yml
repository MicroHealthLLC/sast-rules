# yamllint enable
---
rules:
- id: "scala_xml_rule-XsltTransform"
  mode: "taint"
  pattern-sources:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-inside: |
            def $FUNC(..., $VAR: String, ...): $RET = {
              ...
            }
        - pattern-either:
          - pattern: "new FileInputStream(<... $VAR ...>)"
          - pattern: "getClass.getResourceAsStream(<... $VAR ...>)"
      - patterns:
        - pattern-inside: |
            class $CLZ {
              ...
              val $X = "..."
              ...
            }
        - pattern-inside: |
            def $FUNC(..., $Y: String, ...): $RET = {
              ...
            }
        - pattern-either:
          - pattern: "new FileInputStream($X + $Y)"
          - pattern: "getClass.getResourceAsStream($X + $Y)"
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: |-
          ($T: javax.xml.transform.TransformerFactory).newTransformer($SRC, ...)
      - pattern-inside: |-
          ($T: javax.xml.transform.Transformer).transform($SRC, ...)
      # flow instead of type assertion
      - patterns:
        - pattern-either:
          - pattern-inside: |
              val $FACTORY = javax.xml.transform.TransformerFactory.newInstance
              ...
          - pattern-inside: |
              val $FACTORY = javax.xml.transform.TransformerFactory.newInstance(...)
              ...
        - pattern-inside: "$FACTORY.newTransformer($SRC, ...)"
      - patterns:
        - pattern-either:
          - pattern-inside: |
              val $FACTORY = javax.xml.transform.TransformerFactory.newInstance
              ...
          - pattern-inside: |
              val $FACTORY = javax.xml.transform.TransformerFactory.newInstance(...)
              ...
        - pattern-inside: |
            val $T = $FACTORY.newTransformer(...)
            ...
        - pattern-inside: "$T.transform($SRC, ...)"
    - pattern: "$SRC"
  languages:
  - "scala"
  message: |
    It is possible to attach malicious behavior to those style sheets. Therefore, if an attacker
    can control the content or the source of the style sheet, he might be able to trigger remote
    code execution.
  metadata:
    shortDescription: "XML injection (aka Blind XPath injection)"
    category: "security"
    cwe: "CWE-91"
    owasp:
    - "A1:2017-Injection"
    - "A03:2021-Injection"
    - "A05:2025-Injection"
    security-severity: "Medium"
  severity: "WARNING"
