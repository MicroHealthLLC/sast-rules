# Rule-test fixture for nginx.host-header-in-response; not a server config.
server {
  server_name _;
  location / {
    # ok: nginx.host-header-in-response
    proxy_set_header Host $host;
    proxy_pass http://app:8080;
  }
  location /old/ {
    # ruleid: nginx.host-header-in-response
    return 301 https://$host/new/;
  }
  location /x/ {
    # ruleid: nginx.host-header-in-response
    add_header Content-Location "https://$http_host/x";
  }
  location /y/ {
    # ok: nginx.host-header-in-response
    return 301 https://app.example.com/y/;
  }
}
