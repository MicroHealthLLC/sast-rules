# Rule-test fixture for nginx.proxy-pass-request-variable; not a server config.
server {
  location /fetch/ {
    # ruleid: nginx.proxy-pass-request-variable
    proxy_pass http://$arg_target;
  }
  location /api/ {
    set $upstream "https://api.internal.example";
    resolver 127.0.0.11 valid=10s;
    # ok: nginx.proxy-pass-request-variable
    proxy_pass $upstream;
  }
  location /h/ {
    # ruleid: nginx.proxy-pass-request-variable
    proxy_pass https://$http_x_backend$request_uri;
  }
  location /functions/ {
    set $functions "http://functions:8081";
    # ok: nginx.proxy-pass-request-variable
    proxy_pass $functions$request_uri;
  }
  location /ok-path-arg/ {
    # ok: nginx.proxy-pass-request-variable
    proxy_pass http://app:8080/search?q=$arg_q;
  }
  location /static/ {
    # ok: nginx.proxy-pass-request-variable
    proxy_pass http://static:8080;
  }
}
