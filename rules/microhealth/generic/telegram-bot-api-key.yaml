# Derived by MicroHealth from upstream/opengrep/generic/secrets/security/detected-telegram-bot-api-key.yaml
# (mh.opengrep.generic.secrets.security.detected-telegram-bot-api-key.detected-telegram-bot-api-key, disabled in overrides.yaml in favour of this copy).
# Change: the token regex `[0-9]+:AA[0-9A-Za-z\-_]{33}` had no boundary, so the
# "256:AAAA..." inside an SSH fingerprint "SHA256:AAAA..." matched. A Telegram
# bot token is a bot id of 8-10 digits, a colon and 35 characters starting
# "AA", standing alone: the token now has to start and end at a non-token
# character.
rules:
- id: generic.secrets.telegram-bot-api-key
  patterns:
  - pattern-regex: (?<![0-9A-Za-z_\-])[0-9]{8,10}:AA[0-9A-Za-z\-_]{33}(?![0-9A-Za-z_\-])
  - pattern-not-regex: go\.mod.*
  - pattern-not-regex: v[\d]+\.[\d]+\.[\d]+.*
  languages:
  - regex
  message: Telegram Bot API Key detected
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    source-rule-url: https://github.com/dxa4481/truffleHogRegexes/blob/master/truffleHogRegexes/regexes.json
    category: security
    technology:
    - secrets
    - telegram
    license: Commons Clause License Condition v1.0[LGPL-2.1-only]
    confidence: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    mh_replaces: mh.opengrep.generic.secrets.security.detected-telegram-bot-api-key.detected-telegram-bot-api-key
