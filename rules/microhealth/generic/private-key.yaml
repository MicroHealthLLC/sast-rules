# Derived by MicroHealth from upstream/opengrep/generic/secrets/gitleaks/private-key.yaml
# (mh.opengrep.generic.secrets.gitleaks.private-key.private-key, disabled in overrides.yaml in favour of this copy).
# Change: a PEM armour whose whole body is one template interpolation
# (`-----BEGIN OPENSSH PRIVATE KEY-----\n${lines.join('\n')}\n-----END ...`)
# is code that encodes a key made at run time, not a key; it no longer
# matches. Any literal key material between the armour lines still does.
# The body is also matched lazily (`*?`, was `*`), so each armoured block is
# its own finding instead of one match running from the first BEGIN to the
# last END in the file, which no exclusion could then tell apart.
rules:
- id: generic.secrets.private-key
  message: A gitleaks private-key was detected which attempts to identify hard-coded credentials. It is not recommended to store credentials in source-code, as this risks secrets being leaked and used by either an internal or external malicious adversary. It is recommended to use environment variables to securely provide credentials or retrieve credentials from a secure vault or HSM (Hardware Security Module).
  languages:
  - regex
  severity: INFO
  metadata:
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    category: security
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2021-top25: true
    cwe2022-top25: true
    owasp:
    - A07:2021 - Identification and Authentication Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    source-rule-url: https://github.com/zricethezav/gitleaks/tree/master/cmd/generate/config/rules
    subcategory:
    - vuln
    technology:
    - gitleaks
    mh_replaces: mh.opengrep.generic.secrets.gitleaks.private-key.private-key
  patterns:
  - pattern-regex: (?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY( BLOCK)?-----[\s\S-]*?KEY( BLOCK)?----
  - pattern-not-regex: (?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY( BLOCK)?-----(?:\\[rn]|\s)*\$\{[^\n]*?\}(?:\\[rn]|\s)*-----END[ A-Z0-9_-]{0,100}PRIVATE KEY( BLOCK)?-----
