rules:
  - id: generic.gcp-service-account-key
    languages: [regex]
    severity: ERROR
    message: >-
      A Google Cloud service-account key file with its private key is in the
      source. Anyone who reads it can act as that service account. Remove it,
      load the key from a secret store at run time, and rotate the key in IAM:
      a committed key is leaked.
    metadata:
      category: security
      subcategory: [vuln]
      technology: [gcp, secrets]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      references:
        - https://cloud.google.com/iam/docs/keys-create-delete
      # Replaces mh.opengrep.generic.secrets.security.detected-google-gcm-service-account,
      # which matched the `"type": "service_account"` marker alone and so fired
      # on form placeholders and documentation. The credential is the private
      # key; this rule requires one, with key material, in the same file.
    pattern-either:
      - pattern-regex: >-
          ["']type["']\s*:\s*["']service_account["'][\s\S]{0,4000}?["']private_key["']\s*:\s*["']-----BEGIN (?:RSA )?PRIVATE KEY-----(?:\\n|\n)[A-Za-z0-9+/]{40,}
      - pattern-regex: >-
          ["']private_key["']\s*:\s*["']-----BEGIN (?:RSA )?PRIVATE KEY-----(?:\\n|\n)[A-Za-z0-9+/]{40,}[\s\S]{0,4000}?["']type["']\s*:\s*["']service_account["']
