# Derived by MicroHealth from upstream/gitlab/csharp/crypto/rule-CertificateValidationDisabled.yml
# (mh.gitlab.csharp_crypto_rule-CertificateValidationDisabled, disabled in overrides.yaml in favour of this copy).
# Change: the lambda pattern `(...) => true;` no longer parses on Opengrep
# 1.32.0 (C# "Stdlib.Parsing.Parse_error"), so the upstream rule failed to
# load in both bundles and CI's bundle-load check went red. The pattern is now
# `(...) => true` (an expression, without the statement `;`), which parses and
# matches the same lambdas. Nothing else changed: it still reports any
# ServerCertificateValidationCallback += lambda returning true, and += a
# method whose body is `return true;`.
rules:
- id: csharp.crypto.certificate-validation-disabled
  languages:
  - "csharp"
  patterns:
  - pattern-inside: |
      using System.Net;
      ...
  - pattern: "ServicePointManager.ServerCertificateValidationCallback += $CALLBACK;"
  - metavariable-pattern:
      metavariable: "$CALLBACK"
      patterns:
      - pattern-either:
        - pattern: "$RETURNTYPE $FUNC(...) { return true; }"
        - pattern: "(...) => true"
  message: |
    The `ServicePointManager.ServerCertificateValidationCallback` event has been set
    to always return `true`, which effectively disables the validation of server
    certificates.

    This allows for an adversary who is in between the application and the target host to intercept
    potentially sensitive information or transmit malicious data.

    Remove the callback function that is returning true to allow normal certificate validation to
    proceed.
    When no callback is provided, the client will validate that the certificate name matches the
    hostname
    that was used when creating the request.

    For more information on the `ServerCertificateValidationCallback` property see:
    https://learn.microsoft.com/en-us/dotnet/api/system.net.servicepointmanager.servercertificatevalidationcallback
  severity: "WARNING"
  metadata:
    shortDescription: "Certificate validation disabled"
    category: "security"
    owasp:
    - "A3:2017-Sensitive Data Exposure"
    - "A07:2021-Identification and Authentication Failures"
    - "A07:2025-Authentication Failures"
    cwe: "CWE-295"
    security-severity: "Medium"
    mh_replaces: mh.gitlab.csharp_crypto_rule-CertificateValidationDisabled
