rules:
  - id: json.npm-dependency-mutable-source
    languages: [json]
    severity: WARNING
    message: >-
      This dependency is taken from a source that can change under the same
      name: a dist-tag (`latest`, `next`), any version (`*`, `x`, empty), a
      git branch rather than a commit, or a plain-http URL. Whatever is
      published there next is installed the next time the lockfile is
      refreshed, unreviewed. Use a version range from the registry, or pin a
      git dependency to a full 40-character commit (`#<sha>`) and an http URL
      to https.
    metadata:
      category: security
      subcategory: [audit]
      technology: [npm, pnpm, yarn]
      confidence: MEDIUM
      likelihood: LOW
      impact: HIGH
      cwe: ["CWE-829: Inclusion of Functionality from Untrusted Control Sphere"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://docs.npmjs.com/cli/v10/configuring-npm/package-json#git-urls-as-dependencies
        - https://pnpm.io/cli/install#--frozen-lockfile
    # Replaces mh.opengrep.json.npm.security.package-dependencies-check, which
    # reports every caret or tilde range. A range is resolved once and pinned
    # by the committed lockfile (integrity hash included), so it changes only
    # when someone updates the lockfile in a reviewed commit; that rule
    # fired on all 49 dependencies of a repository installed with
    # --frozen-lockfile. What a lockfile does NOT make reviewable is a source
    # whose meaning moves on its own: a dist-tag, `*`, a git branch, http.
    patterns:
      - pattern-either:
          - pattern-inside: |
              "dependencies": {...}
          - pattern-inside: |
              "devDependencies": {...}
          - pattern-inside: |
              "optionalDependencies": {...}
      - pattern-either:
          - pattern-regex: '"[@\w./-]+"\s*:\s*"(latest|next|canary|beta|\*|x|X|)"'
          - pattern-regex: '"[@\w./-]+"\s*:\s*"http://[^"]*"'
          - patterns:
              - pattern-regex: '"[@\w./-]+"\s*:\s*"(git\+[a-z]+://|git://|github:|gitlab:|bitbucket:|[\w.-]+/[\w.-]+(#|"))[^"]*"'
              - pattern-not-regex: '"[@\w./-]+"\s*:\s*"[^"]*#(commit:|sha:)?[0-9a-f]{40}"'
    paths:
      include:
        - '*package.json'
