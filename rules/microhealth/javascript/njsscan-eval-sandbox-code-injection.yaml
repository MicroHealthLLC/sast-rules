# hash: e7a0a61
# Derived by MicroHealth from upstream/gitlab/rules/lgpl/javascript/eval/rule-sandbox_code_injection.yml
# (mh.gitlab.rules_lgpl_javascript_eval_rule-sandbox-code-injection, disabled in overrides.yaml in favour of this copy).
# Change: the request-handler context `function ($REQ, $RES, ...)` matched any
# function of two or more parameters, so `parse(text, opts)` was "a handler".
# Every handler context now also requires the parameters to be named as an
# HTTP handler names them: the request ^(req|request)$, the response ^(res|resp|response|reply|h)$.
# Search mode: the request name is written into the patterns, one branch per
# name, instead of a metavariable-regex: an unbound $REQ in a sink such as
# `$INP = <... $REQ ...>; ... $RE.test(<... $INP ...>)` matched every
# expression of every file and timed out on large ones.
rules:
- id: javascript.njsscan.eval.sandbox-code-injection
  pattern-either:
  - patterns:
    - pattern-inside: |
        require('sandbox')
        ...
    - pattern-either:
      - pattern-inside: function (req, $RES, ...) {...}
      - pattern-inside: function $FUNC(req, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(req, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(req, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(req, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $S.run(<... req.$QUERY.$FOO ...>,...)
      - pattern: |
          $CODE = <... req.$QUERY.$FOO ...>;
          ...
          $S.run(<... $CODE ...>,...)
      - pattern: |
          new $SANDBOX(...).run(<... req.$QUERY.$FOO ...>,...)
      - pattern: |
          $CODE = <... req.$QUERY.$FOO ...>;
          ...
          new $SANDBOX(...).run(<... $CODE ...>,...)
      - pattern: |
          $S.run(<... req.$BODY ...>,...)
      - pattern: |
          $CODE = <... req.$BODY ...>;
          ...
          $S.run(<... $CODE ...>,...)
      - pattern: |
          new $SANDBOX(...).run(<... req.$BODY ...>,...)
      - pattern: |-
          $CODE = <... req.$BODY ...>;
          ...
          new $SANDBOX(...).run(<... $CODE ...>,...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  - patterns:
    - pattern-inside: |
        require('sandbox')
        ...
    - pattern-either:
      - pattern-inside: function (request, $RES, ...) {...}
      - pattern-inside: function $FUNC(request, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(request, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(request, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(request, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $S.run(<... request.$QUERY.$FOO ...>,...)
      - pattern: |
          $CODE = <... request.$QUERY.$FOO ...>;
          ...
          $S.run(<... $CODE ...>,...)
      - pattern: |
          new $SANDBOX(...).run(<... request.$QUERY.$FOO ...>,...)
      - pattern: |
          $CODE = <... request.$QUERY.$FOO ...>;
          ...
          new $SANDBOX(...).run(<... $CODE ...>,...)
      - pattern: |
          $S.run(<... request.$BODY ...>,...)
      - pattern: |
          $CODE = <... request.$BODY ...>;
          ...
          $S.run(<... $CODE ...>,...)
      - pattern: |
          new $SANDBOX(...).run(<... request.$BODY ...>,...)
      - pattern: |-
          $CODE = <... request.$BODY ...>;
          ...
          new $SANDBOX(...).run(<... $CODE ...>,...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  message: |
    Unrusted data in `sandbox` can result in code injection.
  severity: ERROR
  languages:
  - javascript
  metadata:
    cwe: CWE-94
    shortDescription: Improper control of generation of code (Code Injection)
    category: security
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    security-severity: CRITICAL
    mh_replaces: mh.gitlab.rules_lgpl_javascript_eval_rule-sandbox-code-injection
