# hash: e7a0a61
# Derived by MicroHealth from upstream/gitlab/rules/lgpl/javascript/ssrf/rule-wkhtmltopdf_ssrf.yml
# (mh.gitlab.rules_lgpl_javascript_ssrf_rule-wkhtmltopdf-ssrf, disabled in overrides.yaml in favour of this copy).
# Change: the request-handler context `function ($REQ, $RES, ...)` matched any
# function of two or more parameters, so `parse(text, opts)` was "a handler".
# Every handler context now also requires the parameters to be named as an
# HTTP handler names them: the request ^(req|request)$, the response ^(res|resp|response|reply|h)$.
# Search mode: the request name is written into the patterns, one branch per
# name, instead of a metavariable-regex: an unbound $REQ in a sink such as
# `$INP = <... $REQ ...>; ... $RE.test(<... $INP ...>)` matched every
# expression of every file and timed out on large ones.
rules:
- id: javascript.njsscan.ssrf.wkhtmltopdf-ssrf
  pattern-either:
  - patterns:
    - pattern-inside: |
        require('wkhtmltopdf')
        ...
    - pattern-either:
      - pattern-inside: function (req, $RES, ...) {...}
      - pattern-inside: function $FUNC(req, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(req, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(req, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(req, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $INP = <... req.$VAR ...>;
          ...
          wkhtmltopdf(<... $INP ...>, ...)
      - pattern: |
          $INP = <... req.$VAR.$FOO ...>;
          ...
          wkhtmltopdf(<... $INP ...>, ...)
      - pattern: |
          wkhtmltopdf(<... req.$VAR ...>, ...)
      - pattern: |
          wkhtmltopdf(<... req.$VAR.$FOO ...>, ...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  - patterns:
    - pattern-inside: |
        require('wkhtmltopdf')
        ...
    - pattern-either:
      - pattern-inside: function (request, $RES, ...) {...}
      - pattern-inside: function $FUNC(request, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(request, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(request, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(request, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $INP = <... request.$VAR ...>;
          ...
          wkhtmltopdf(<... $INP ...>, ...)
      - pattern: |
          $INP = <... request.$VAR.$FOO ...>;
          ...
          wkhtmltopdf(<... $INP ...>, ...)
      - pattern: |
          wkhtmltopdf(<... request.$VAR ...>, ...)
      - pattern: |
          wkhtmltopdf(<... request.$VAR.$FOO ...>, ...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  message: |
    User controlled URL reached to `wkhtmltopdf` can result in Server Side Request Forgery (SSRF).
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp:
    - A1:2017-Injection
    - A10:2021-Server-Side Request Forgery
    - A01:2025-Broken Access Control
    cwe: CWE-918
    shortDescription: Server-side request forgery (SSRF)
    security-severity: CRITICAL
    category: security
    mh_replaces: mh.gitlab.rules_lgpl_javascript_ssrf_rule-wkhtmltopdf-ssrf
