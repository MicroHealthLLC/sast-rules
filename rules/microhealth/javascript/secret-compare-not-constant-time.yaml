rules:
  - id: javascript.secret-compare-not-constant-time
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A value from the HTTP request is compared with `$SECRET` using ==/===.
      String equality stops at the first differing character, so a client who
      can time many attempts can recover a token, an HMAC or a password hash
      one character at a time.
      Compare digests with crypto.timingSafeEqual (equal-length Buffers), or
      compare hashes of both values.
    metadata:
      category: security
      subcategory: [vuln]
      technology: [node.js, express, koa, fastify]
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      cwe: ["CWE-208: Observable Timing Discrepancy"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptotimingsafeequala-b
    # Replaces mh.gitlab.javascript_timing_rule-possible-timing-attacks and
    # mh.gitlab.rules_lgpl_javascript_crypto_rule-node-timing-attack. Both
    # exclude a comparison with null/undefined only in a braced `if {...};`,
    # so `if (token === null) return;` and `if (token === '%s')` were
    # reported, and neither knows `hmac`, `signature` or `digest`. Here any
    # comparison with a literal, null, undefined or typeof is excluded,
    # whatever the statement around it -- and, since a timing attack needs
    # the attacker to supply one side and time the answer, the other side
    # must come from the request (two values the program already holds, such
    # as a password and its confirmation or a stored token and a refreshed
    # one, leak nothing).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.$GETTER(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
          - metavariable-regex:
              metavariable: $GETTER
              regex: ^(get|header|param)$
      - patterns:
          - pattern: $REQ.$FIELD
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(query|params|body|headers|cookies|signedCookies|url|originalUrl|path|files|file)$
      - patterns:
          - pattern: $EVENT.$FIELD
          - metavariable-regex:
              metavariable: $EVENT
              regex: ^event$
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(body|queryStringParameters|multiValueQueryStringParameters|pathParameters)$
      - patterns:
          - pattern-either:
              - pattern-inside: '$WS.on("message", function ($DATA, ...) {...})'
              - pattern-inside: '$WS.on("message", ($DATA, ...) => {...})'
              - pattern-inside: '$WS.on("message", async ($DATA, ...) => {...})'
          - focus-metavariable: $DATA
          - pattern: $DATA
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $SECRET == $OTHER
              - pattern: $SECRET === $OTHER
              - pattern: $SECRET != $OTHER
              - pattern: $SECRET !== $OTHER
              - pattern: $OTHER == $SECRET
              - pattern: $OTHER === $SECRET
              - pattern: $OTHER != $SECRET
              - pattern: $OTHER !== $SECRET
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^([\w$]+\.)*(password|passwd|passphrase|secret|token|api_?key|api_?secret|auth_?token|access_?token|hmac|signature|digest|password_?hash|hashed_?password|expected\w*)$
          - focus-metavariable: $OTHER
