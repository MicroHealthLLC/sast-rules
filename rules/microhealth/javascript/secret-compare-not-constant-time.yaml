rules:
  - id: javascript.secret-compare-not-constant-time
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A secret ($S) is compared with `==` / `===`. String comparison stops at
      the first differing character, so the time it takes tells a caller how
      much of a guess was right (timing attack). Compare secrets with a
      constant-time function (crypto.timingSafeEqual over equal-length
      buffers, or the project's constant-time helper).
    metadata:
      category: security
      subcategory: [audit]
      technology: [javascript, typescript]
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      cwe: ["CWE-208: Observable Timing Discrepancy"]
      references:
        - https://nodejs.org/api/crypto.html#cryptotimingsafeequala-b
      # Replaces mh.gitlab.javascript_timing_rule-possible-timing-attacks,
      # which also reported a secret-named variable compared with a LITERAL
      # (`if (token === "") continue;` while splitting a list, `apiKey ===
      # null`): a check that a value is empty or missing reveals nothing
      # about any secret. This rule reports comparisons of a secret with
      # another value, and covers any expression, not only `if (...)`.
      # Narrowed after TueriDev: a secret-named value on BOTH sides (camelCase
      # or optional chaining, `activeIndexToken`, `inFlight?.token`) and a
      # password's confirmation field are values the program holds.
    patterns:
      - pattern-either:
          - pattern: '$S == $O'
          - pattern: '$O == $S'
          - pattern: '$S === $O'
          - pattern: '$O === $S'
          - pattern: '$S != $O'
          - pattern: '$O != $S'
          - pattern: '$S !== $O'
          - pattern: '$O !== $S'
      # Two values the program already holds compared with each other involve
      # nothing a caller chose: `token !== this.token` ("did my own token
      # change?"), a generation counter (`token !== activeIndexToken`), a
      # stored signature against the configured one. So the other side ($O)
      # may not be secret-named itself -- unless its name says it came from
      # outside (provided/input/received/request/header/query/body/param/
      # cookie), which is the comparison a timing attack needs.
      - metavariable-regex:
          metavariable: $O
          regex: '(?i)^(?!(?![\w$?.\[\]''"-]*(?:provided|given|input|incoming|received|supplied|request|req\b|header|query|body|param|cookie))[\w$?.]*(?:password|passwd|pass|secret|token|api_?key|apikey|api_?secret|hmac|signature|hash|service_?role_?key|service_?key)$)'
      # A password compared with its confirmation field on a sign-up form
      # (confirm, again, repeat, retype, re-enter) is a typing check, not a
      # guess against a secret.
      - metavariable-regex:
          metavariable: $O
          regex: '(?i)^(?!(?:[\w$?.]*\.)?(?:confirm\w*|\w*confirm(?:ation)?\w*|again|\w*again|repeat\w*|\w*repeat(?:ed)?|re_?type\w*|\w*retyped|re_?enter\w*|\w*reentered)$)'
      # Narrowed after Fluenta (2026-10-14). A number reveals nothing to
      # time: `pass === 0` / `password === 0` compares a loop counter or a
      # numeric field. And a value compared with a React ref's `.current`,
      # or with a name that says it is the previous/last/cached copy
      # (`lastSavedSignature`, `prevToken`, `presenceSignatureRef`), is a
      # change-detection fingerprint the program computed and stored itself
      # ("has this changed since I last saved it?"), not a guess against a
      # secret. `last`/`prev`/`previous`/`ref` count only as a whole word of
      # the name (camelCase hump, `_`, `.`), so `refreshToken` or `href` do
      # not qualify. (6 of 11 hits in Fluenta: 2 numeric, 4 `.current`.)
      - metavariable-regex:
          metavariable: $O
          regex: '^(?!-?\d[\w.]*$|[\w$?.]*\.current$|[\w$?.]*?(?:(?:^|[._$?])(?i:last|prev|previous|ref)|(?<=[a-z0-9])(?:Last|Prev|Previous|Ref))(?=[A-Z0-9_$.?]|$))'
      - metavariable-regex:
          metavariable: $S
          regex: (?i)^(\w*\.)?(password|passwd|pass|secret|client_?secret|token|access_?token|auth_?token|api_?key|apikey|api_?secret|hmac|signature|service_?role_?key|service_?key)$
      - pattern-not: '$S == "..."'
      - pattern-not: '"..." == $S'
      - pattern-not: '$S == null'
      - pattern-not: 'null == $S'
      - pattern-not: '$S == undefined'
      - pattern-not: 'undefined == $S'
      - pattern-not: '$S == true'
      - pattern-not: 'true == $S'
      - pattern-not: '$S == false'
      - pattern-not: 'false == $S'
      - pattern-not: '$S === "..."'
      - pattern-not: '"..." === $S'
      - pattern-not: '$S === null'
      - pattern-not: 'null === $S'
      - pattern-not: '$S === undefined'
      - pattern-not: 'undefined === $S'
      - pattern-not: '$S === true'
      - pattern-not: 'true === $S'
      - pattern-not: '$S === false'
      - pattern-not: 'false === $S'
      - pattern-not: '$S != "..."'
      - pattern-not: '"..." != $S'
      - pattern-not: '$S != null'
      - pattern-not: 'null != $S'
      - pattern-not: '$S != undefined'
      - pattern-not: 'undefined != $S'
      - pattern-not: '$S != true'
      - pattern-not: 'true != $S'
      - pattern-not: '$S != false'
      - pattern-not: 'false != $S'
      - pattern-not: '$S !== "..."'
      - pattern-not: '"..." !== $S'
      - pattern-not: '$S !== null'
      - pattern-not: 'null !== $S'
      - pattern-not: '$S !== undefined'
      - pattern-not: 'undefined !== $S'
      - pattern-not: '$S !== true'
      - pattern-not: 'true !== $S'
      - pattern-not: '$S !== false'
      - pattern-not: 'false !== $S'
