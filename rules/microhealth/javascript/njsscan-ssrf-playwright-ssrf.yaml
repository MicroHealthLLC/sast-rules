# (mh.gitlab.rules_lgpl_javascript_ssrf_rule-playwright-ssrf, disabled in overrides.yaml in favour of this copy).
# Change: the request-handler context `function ($REQ, $RES, ...)` matched any
# function of two or more parameters, so `parse(text, opts)` was "a handler".
# Every handler context now also requires the parameters to be named as an
# HTTP handler names them: the request ^(req|request)$, the response ^(res|resp|response|reply|h)$.
# Search mode: the request name is written into the patterns, one branch per
# name, instead of a metavariable-regex: an unbound $REQ in a sink such as
# `$INP = <... $REQ ...>; ... $RE.test(<... $INP ...>)` matched every
# expression of every file and timed out on large ones.
rules:
- id: javascript.njsscan.ssrf.playwright-ssrf
  pattern-either:
  - patterns:
    - pattern-inside: |
        require('playwright')
        ...
    - pattern-either:
      - pattern-inside: function $FUNC(req, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(req, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(req, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(req, $RES, ...) {...})
    - pattern-either:
      - pattern: $PAGE.goto(<... req.$QUERY.$FOO ...>, ...)
      - pattern: $PAGE.goto(<... req.$BODY ...>, ...)
      - pattern: $PAGE.setContent(<... req.$QUERY.$FOO ...>, ...)
      - pattern: $PAGE.setContent(<... req.$BODY ...>, ...)
      - pattern: $PAGE.evaluate(<... req.$QUERY.$FOO ...>, ...)
      - pattern: $PAGE.evaluate(<... req.$BODY ...>, ...)
      - pattern: $PAGE.evaluate($CODE,..., <... req.$QUERY.$FOO ...>, ...)
      - pattern: $PAGE.evaluate($CODE,..., <... req.$BODY ...>, ...)
      - pattern: $PAGE.evaluateHandle(<... req.$QUERY.$FOO ...>, ...)
      - pattern: $PAGE.evaluateHandle(<... req.$BODY ...>, ...)
      - pattern: $PAGE.evaluateHandle($CODE,..., <... req.$QUERY.$FOO ...>, ...)
      - pattern: $PAGE.evaluateHandle($CODE,..., <... req.$BODY ...>, ...)
      - pattern: $PAGE.evaluateOnNewDocument(<... req.$BODY ...>, ...)
      - pattern: $PAGE.evaluateOnNewDocument(<... req.$BODY.$FOO ...>, ...)
      - pattern: $CONTEXT.addInitScript(<... req.$BODY ...>,...)
      - pattern: $CONTEXT.addInitScript(<... req.$BODY.$FOO ...>,...)
      - pattern: |
          $INPUT = <... req.$QUERY.$FOO ...>;
          ...
          $PAGE.goto(<... $INPUT ...>,...)
      - pattern: |
