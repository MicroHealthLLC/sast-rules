# hash: e7a0a61
# Derived by MicroHealth from upstream/gitlab/rules/lgpl/javascript/eval/rule-eval_require.yml
# (mh.gitlab.rules_lgpl_javascript_eval_rule-eval-require, disabled in overrides.yaml in favour of this copy).
# Change: the request-handler context `function ($REQ, $RES, ...)` matched any
# function of two or more parameters, so `parse(text, opts)` was "a handler".
# Every handler context now also requires the parameters to be named as an
# HTTP handler names them: the request ^(req|request)$, the response ^(res|resp|response|reply|h)$.
rules:
- id: javascript.njsscan.eval.eval-require
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: |
        function ($REQ, $RES, ...) {...}
    - focus-metavariable: $REQ
    - metavariable-regex:
        metavariable: $REQ
        regex: ^(req|request)$
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  pattern-sinks:
  - patterns:
    - pattern: |
        require($REQ, ...)
    - focus-metavariable: $REQ
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: |
          if($VALIDATION){
          ...
          require($REQ, ...)
          ...
          }
      - pattern: |
          $A = $VALIDATION
          ...
          if($A){
          ...
          require($REQ, ...)
          ...
          }
    - metavariable-pattern:
        metavariable: $VALIDATION
        pattern-either:
        - pattern: |
            $AL.includes(...)
        - pattern: |
            $AL.indexOf(...) !== -1
        - pattern: |
            $AL.find(...) !== undefined
        - pattern: |
            $ALS.has(...)
  message: |
    Passing untrusted user input directly into the require() function without proper
    validation or sanitization can possibly cause a vulnerability known as remote code execution (RCE).
    An attacker could manipulate the input to load and execute arbitrary code from external sources,
    potentially leading to severe security breaches such as data theft, system compromise,
    or unauthorized access.
    To mitigate this risk, it's crucial to validate and sanitize user input
    thoroughly before passing it to functions like require(), ensuring that only trusted and safe inputs are utilized.

    Following is an example of secure validation against allowlist to prevent the vulnerability:
    ```
    // Define a list of explicitly allowed packages for require
    const allowedPkgs = [
        'package1',
        'package2',
        'package3'
    ];

    app.get("/eval/require/7", async (req, res) => {
        var isAllowed = allowedPkgs.includes(req.query.name);
        if (isAllowed) {
            // ok: rules_lgpl_javascript_eval_rule-eval-require
            var cp = require(req.query.name);
            cp.exec('ls', (error, stdout, stderr) => {
                console.log("exec output : \n", stdout)
            });
        }
        res.send("Please check console logs.");
    });
    ```
  severity: ERROR
  languages:
  - javascript
  metadata:
    cwe: CWE-95
    shortDescription: Improper neutralization of directives in dynamically evaluated code ('Eval Injection')
    category: security
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    - A05:2025-Injection
    security-severity: CRITICAL
    mh_replaces: mh.gitlab.rules_lgpl_javascript_eval_rule-eval-require
