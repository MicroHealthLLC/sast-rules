# hash: e7a0a61
# Derived by MicroHealth from upstream/gitlab/rules/lgpl/javascript/xml/rule-node_entity_expansion.yml
# (mh.gitlab.rules_lgpl_javascript_xml_rule-node-entity-expansion, disabled in overrides.yaml in favour of this copy).
# Change: the request-handler context `function ($REQ, $RES, ...)` matched any
# function of two or more parameters, so `parse(text, opts)` was "a handler".
# Every handler context now also requires the parameters to be named as an
# HTTP handler names them: the request ^(req|request)$, the response ^(res|resp|response|reply|h)$.
# Search mode: the request name is written into the patterns, one branch per
# name, instead of a metavariable-regex: an unbound $REQ in a sink such as
# `$INP = <... $REQ ...>; ... $RE.test(<... $INP ...>)` matched every
# expression of every file and timed out on large ones.
rules:
- id: javascript.njsscan.xml.node-entity-expansion
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern-inside: function (req, $RES, ...) {...}
      - pattern-inside: function $FUNC(req, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(req, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(req, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(req, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $PARSER = new expat.Parser()
          ...
          $PARSER.write(..., <... req.$QUERY ...>, ...)
      - pattern: |
          $PARSER = new expat.Parser()
          ...
          $PARSER.write(..., <... req.$QUERY.$FOO ...>, ...)
      - pattern: |
          $PARSER = new expat.Parser()
          ...
          $PARSER.write(..., <... req.$QUERY.$FOO.$FILE ...>, ...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  - patterns:
    - pattern-either:
      - pattern-inside: function (request, $RES, ...) {...}
      - pattern-inside: function $FUNC(request, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(request, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(request, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(request, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $PARSER = new expat.Parser()
          ...
          $PARSER.write(..., <... request.$QUERY ...>, ...)
      - pattern: |
          $PARSER = new expat.Parser()
          ...
          $PARSER.write(..., <... request.$QUERY.$FOO ...>, ...)
      - pattern: |
          $PARSER = new expat.Parser()
          ...
          $PARSER.write(..., <... request.$QUERY.$FOO.$FILE ...>, ...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  message: |
    User controlled data in XML Parsers can result in XML Internal Entity Processing vulnerabilities like in DoS.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp:
    - A4:2017-XML External Entities (XXE)
    - A05:2021-Security Misconfiguration
    - A02:2025-Security Misconfiguration
    cwe: CWE-776
    shortDescription: Improper restriction of recursive entity references in DTDs (XML Entity Expansion)
    security-severity: CRITICAL
    category: security
    mh_replaces: mh.gitlab.rules_lgpl_javascript_xml_rule-node-entity-expansion
