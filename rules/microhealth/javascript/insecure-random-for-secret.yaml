rules:
  - id: javascript.insecure-random-for-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Math.random() (or crypto.pseudoRandomBytes) produces a value used as a
      secret: a token, password, nonce, salt or key. Its output is predictable
      from a few earlier values, so someone who sees some of them can guess the
      next. Use crypto.randomBytes / crypto.randomUUID in Node, or
      crypto.getRandomValues in the browser.
    metadata:
      category: security
      subcategory: [vuln]
      technology: [javascript, node.js]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://nodejs.org/api/crypto.html#cryptorandombytessize-callback
    # Replaces mh.gitlab.rules_lgpl_javascript_crypto_rule-node-insecure-random-generator,
    # which reports every Math.random() call: UI jitter, a search's display
    # id, a welcome message's choice of greeting. Like
    # mh.microhealth.python.insecure-random-for-secret, this flags it only
    # where the value is named as a secret. crypto.pseudoRandomBytes is
    # deprecated and always reported.
    pattern-either:
      - pattern: $CRYPTO.pseudoRandomBytes(...)
      - patterns:
          - pattern: Math.random()
          - pattern-either:
              - pattern-inside: $NAME = <... Math.random() ...>
              - pattern-inside: const $NAME = <... Math.random() ...>
              - pattern-inside: let $NAME = <... Math.random() ...>
              - pattern-inside: var $NAME = <... Math.random() ...>
              - pattern-inside: '{..., $NAME: <... Math.random() ...>, ...}'
              - pattern-inside: |
                  function $NAME(...) {
                    ...
                  }
              - pattern-inside: const $NAME = (...) => $BODY
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(password|passwd|passphrase|secret|token|nonce|salt|otp|csrf|xsrf|api_?key|session_?id|session_?key|credential|private_?key|verifier|challenge)
