rules:
  - id: javascript.insecure-random-for-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A value that guards access (a token, secret, password, nonce, salt,
      session or reset code, key or identifier) is made from Math.random() or
      crypto.pseudoRandomBytes(). Neither is a cryptographic generator: their
      output can be predicted from earlier output. Use crypto.randomUUID(),
      crypto.getRandomValues() or crypto.randomBytes().
    metadata:
      category: security
      subcategory: [vuln]
      technology: [javascript, node.js, browser]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      cwe: ["CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/random
      # Replaces mh.gitlab.rules_lgpl_javascript_crypto_rule-node-insecure-random-generator,
      # which reported EVERY Math.random(): retry jitter, skeleton-loader
      # widths, shuffles, sampling. Predicting those gains an attacker
      # nothing. This rule reports the weak generator where its output
      # becomes something that must not be guessed: assigned to, returned
      # from, or stored under a name that says so. crypto.pseudoRandomBytes()
      # is reported wherever it appears, as upstream did (it has no other use).
    pattern-either:
      - pattern: crypto.pseudoRandomBytes(...)
      - pattern: $C.pseudoRandomBytes(...)
      # A value bound to a name that says it must not be guessed.
      - patterns:
          - pattern-either:
              - pattern: $NAME = <... Math.random() ...>
              - pattern: let $NAME = <... Math.random() ...>
              - pattern: const $NAME = <... Math.random() ...>
              - pattern: var $NAME = <... Math.random() ...>
              - pattern: $OBJ.$NAME = <... Math.random() ...>
              - pattern: '{..., $NAME: <... Math.random() ...>, ...}'
              - pattern: 'const $NAME = (...) => <... Math.random() ...>'
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(?:token|secret|passw|pwd|nonce|salt|otp|csrf|xsrf|session|api_?key|private_?key|signing_?key|secret_?key|credential|auth(?!or)|uuid|guid|verifier|challenge|reset_?code|invite_?code|verification)
      # Returned from a function whose name says the same.
      - patterns:
          - pattern-either:
              - pattern-inside: function $FN(...) { ... }
              - pattern-inside: const $FN = (...) => { ... }
          - pattern: return <... Math.random() ...>;
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(?:token|secret|passw|pwd|nonce|salt|otp|csrf|xsrf|session|api_?key|private_?key|signing_?key|secret_?key|credential|auth(?!or)|uuid|guid|verifier|challenge|reset_?code|invite_?code|verification)
