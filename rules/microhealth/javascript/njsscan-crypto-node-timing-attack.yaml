# Derived by MicroHealth from upstream/gitlab/rules/lgpl/javascript/crypto/rule-node_timing_attack.yml
# (mh.gitlab.rules_lgpl_javascript_crypto_rule-node-timing-attack, disabled in overrides.yaml in favour of this copy).
# Change: a comparison of a secret-named variable with a literal (null,
# undefined, a boolean, a number, a string such as '') leaks nothing an
# attacker controls the other side of: it is an emptiness or presence check.
# The upstream pattern-nots meant to drop those carry a trailing `;` and never
# match, so `if (token !== null) {...}` fired. The other side ($X) must now be
# something other than a literal.
# Change (TueriDev): $X may not itself be a secret-named value the program
# holds (`token !== activeIndexToken`, a generation counter; `hash ===
# storedHash`) unless its name says it came from a request, header, query,
# body, param, cookie or input; nor a password's confirmation field.
# Change (simplr-ehr): $X may not be a React ref's `.current` (`if
# (latest.current !== token) return;`): a request-generation counter the
# component wrote itself, compared to drop a stale response.
rules:
- id: javascript.njsscan.crypto.node-timing-attack
  patterns:
  - pattern-not: if ($Z == null) { ... };
  - pattern-not: if ($Z === null) { ... };
  - pattern-not: if ($Z != null) { ... };
  - pattern-not: if ($Z !== null) { ... };
  - pattern-not: if ($Q != undefined) { ... };
  - pattern-not: if ($Q !== undefined) { ... };
  - pattern-not: if ($Q == undefined) { ... };
  - pattern-not: if ($Q === undefined) { ... };
  - pattern-not: return $Y == null;
  - pattern-not: return $Y === null;
  - pattern-not: return $Y != null;
  - pattern-not: return $Y !== null;
  - pattern-not: return $Y == undefined;
  - pattern-not: return $Y === undefined;
  - pattern-not: return $Y != undefined;
  - pattern-not: return $Y !== undefined;
