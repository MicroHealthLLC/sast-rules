rules:
  - id: javascript.insecure-websocket-url
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      This code opens, or builds the address of, a plaintext `ws://` WebSocket
      to a host that is not this computer. Everything on that socket, session
      tokens included, crosses the network in clear text and can be read or
      changed in transit. Use `wss://`.
    metadata:
      category: security
      subcategory: [vuln]
      technology: [websocket]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API/Writing_WebSocket_client_applications#security_considerations
      # Replaces mh.opengrep.javascript.lang.security.detect-insecure-websocket,
      # a `regex` rule over every file: it reported `ws://` in comments,
      # JSDoc and Markdown prose (an ADR explaining why the dev server needs
      # ws:// was a HIGH finding), where no connection exists. This rule reads
      # JavaScript/TypeScript string and template literals only. Loopback
      # (localhost, 127.0.0.0/8, [::1]) stays exempt, as upstream had it.
    pattern-either:
      # A template whose host is interpolated (`ws://${location.host}/x`):
      # the engine sees its literal pieces as separate strings, so its
      # leading `ws://` piece has no host character of its own.
      - pattern: '`ws://${$HOST}...`'
      - patterns:
        - pattern-either:
            - pattern: '"$URL"'
            - pattern: '`$URL`'
        - metavariable-regex:
            metavariable: $URL
            # The scheme must be followed by a host: the bare literal `'ws://'`
            # in `url.startsWith('ws://')` is a scheme test, not an address
            # (Fluenta, 2026-10-14: 3 hits, all `startsWith` scheme
            # checks). Any ws:// URL naming a host, private-network service
            # names included, is still reported.
            regex: (?i)^ws://(?!(?:localhost|127(?:\.\d{1,3}){3}|\[::1\])(?:[:/?#]|$))[^/?#\s]
