rules:
  - id: javascript.ssrf-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A value from the HTTP request (or a WebSocket message) decides the URL
      this server fetches. A client can point it at an internal address -- a
      cloud metadata endpoint, an admin port on localhost, a service behind the
      firewall -- and read the answer through this server (SSRF). Build the URL
      from a fixed origin and take only a path or an id from the request, or
      check the host against an allow-list before the request is made.
    metadata:
      category: security
      subcategory: [vuln]
      technology: [node.js, express, koa, fastify, next.js]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    # Replaces mh.gitlab.rules_lgpl_javascript_ssrf_rule-node-ssrf, whose
    # source is the first parameter of ANY function with two or more
    # parameters (it assumes `function (req, res)`), so a helper such as
    # `(port, path) => fetch(...)` or a CLI's own documentation fetch was
    # reported as SSRF. Here the source is what a client sends.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.$GETTER(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
          - metavariable-regex:
              metavariable: $GETTER
              regex: ^(get|header|param)$
      - patterns:
          - pattern: $REQ.$FIELD
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|ctx\.request)$
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(query|params|body|headers|cookies|signedCookies|url|originalUrl|path|files|file)$
      - patterns:
          - pattern: $EVENT.$FIELD
          - metavariable-regex:
              metavariable: $EVENT
              regex: ^event$
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(body|queryStringParameters|multiValueQueryStringParameters|pathParameters)$
      - patterns:
          - pattern-either:
              - pattern-inside: '$WS.on("message", function ($DATA, ...) {...})'
              - pattern-inside: '$WS.on("message", ($DATA, ...) => {...})'
              - pattern-inside: '$WS.on("message", async ($DATA, ...) => {...})'
          - focus-metavariable: $DATA
          - pattern: $DATA
    pattern-sanitizers:
      # A check on the value sanitises it from that point on: the usual
      # `if (!isAllowedHost(url)) return ...` guard.
      - by-side-effect: true
        patterns:
          - pattern: $F($X, ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)(.*\.)?(isAllowed\w*|assertAllowed\w*|isSafeUrl|validateUrl|allowlisted\w*|checkHost\w*)$
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: got($URL, ...)
              - pattern: request($URL, ...)
              - pattern: undici.request($URL, ...)
          - focus-metavariable: $URL
      - patterns:
          - pattern: $CLIENT.$METHOD($URL, ...)
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^(axios|got|http|https|superagent|needle|ky|undici)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|head|request|options)$
          - focus-metavariable: $URL
