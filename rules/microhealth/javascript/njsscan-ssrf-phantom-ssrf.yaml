      - pattern: $PAGE.evaluateJavaScript(<... request.$BODY ...>,...)
      - pattern: $PAGE.property("content",<... request.$QUERY.$FOO ...>,...)
      - pattern: $PAGE.property("content",<... request.$BODY ...>,...)
      - pattern: |
          $INPUT = <... request.$QUERY.$FOO ...>;
