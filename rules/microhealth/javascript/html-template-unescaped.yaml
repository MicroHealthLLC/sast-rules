rules:
  - id: javascript.html-template-unescaped
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This template literal builds HTML and interpolates a value that is not
      passed through an escaping function. If the value can hold `<`, `&` or a
      quote from a user, a file or a model's output, the result can carry a
      script (XSS). Escape every interpolated value (an escapeHtml helper, or
      DOMPurify.sanitize for markup you mean to keep), or build the element
      with the DOM / a framework that escapes by default.
    metadata:
      category: security
      subcategory: [audit]
      technology: [javascript, typescript]
      confidence: LOW
      likelihood: LOW
      impact: MEDIUM
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    # Replaces mh.opengrep.javascript.lang.security.html-in-template-string,
    # whose test for "looks like HTML" is any `<` followed by a letter. It
    # reported usage text (`tueridev config set <key>`), file-name
    # placeholders (`<chain>`), git's own messages and HTML whose every value
    # was already escaped. Here the literal must contain a real HTML element
    # and the interpolated value must not be an escaping call.
    # HTML a test builds as a fixture is never served to anyone.
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '__tests__/'
        - 'e2e/'
    patterns:
      - pattern-either:
          - pattern: '`$HTML${$VAR}...`'
          - pattern: '`...${$VAR}$HTML`'
      - metavariable-regex:
          metavariable: $HTML
          regex: (?is).*</?(a|b|body|br|button|code|div|em|form|h[1-6]|head|html|i|iframe|img|input|label|li|link|meta|ol|option|p|pre|script|section|select|span|strong|style|svg|table|tbody|td|textarea|th|thead|title|tr|u|ul)(\s|>|/>)
      # The interpolated value is not an escaping call or a number.
      - pattern-not: '`$HTML${escapeHtml(...)}...`'
      - pattern-not: '`...${escapeHtml(...)}$HTML`'
      - pattern-not: '`$HTML${escapeHTML(...)}...`'
      - pattern-not: '`...${escapeHTML(...)}$HTML`'
      - pattern-not: '`$HTML${escape(...)}...`'
      - pattern-not: '`...${escape(...)}$HTML`'
      - pattern-not: '`$HTML${htmlEscape(...)}...`'
      - pattern-not: '`...${htmlEscape(...)}$HTML`'
      - pattern-not: '`$HTML${escapeAttr(...)}...`'
      - pattern-not: '`...${escapeAttr(...)}$HTML`'
      - pattern-not: '`$HTML${escapeAttribute(...)}...`'
      - pattern-not: '`...${escapeAttribute(...)}$HTML`'
      - pattern-not: '`$HTML${encodeURIComponent(...)}...`'
      - pattern-not: '`...${encodeURIComponent(...)}$HTML`'
      - pattern-not: '`$HTML${encodeURI(...)}...`'
      - pattern-not: '`...${encodeURI(...)}$HTML`'
      - pattern-not: '`$HTML${sanitize(...)}...`'
      - pattern-not: '`...${sanitize(...)}$HTML`'
      - pattern-not: '`$HTML${sanitizeHtml(...)}...`'
      - pattern-not: '`...${sanitizeHtml(...)}$HTML`'
      - pattern-not: '`$HTML${DOMPurify.sanitize(...)}...`'
      - pattern-not: '`...${DOMPurify.sanitize(...)}$HTML`'
      - pattern-not: '`$HTML${$O.escape(...)}...`'
      - pattern-not: '`...${$O.escape(...)}$HTML`'
      - pattern-not: '`$HTML${$O.escapeHtml(...)}...`'
      - pattern-not: '`...${$O.escapeHtml(...)}$HTML`'
      - pattern-not: '`$HTML${$O.encode(...)}...`'
      - pattern-not: '`...${$O.encode(...)}$HTML`'
      - pattern-not: '`$HTML${$O.sanitize(...)}...`'
      - pattern-not: '`...${$O.sanitize(...)}$HTML`'
      - pattern-not: '`$HTML${Number(...)}...`'
      - pattern-not: '`...${Number(...)}$HTML`'
      - pattern-not: '`$HTML${$A.length}...`'
      - pattern-not: '`...${$A.length}$HTML`'
      - pattern-not: '`$HTML${$A.size}...`'
      - pattern-not: '`...${$A.size}$HTML`'
      - pattern-not: '`$HTML${$A.toFixed(...)}...`'
      - pattern-not: '`...${$A.toFixed(...)}$HTML`'
