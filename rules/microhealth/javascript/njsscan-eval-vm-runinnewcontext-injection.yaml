# hash: e7a0a61
# Derived by MicroHealth from upstream/gitlab/rules/lgpl/javascript/eval/rule-vm_runinnewcontext_injection.yml
# (mh.gitlab.rules_lgpl_javascript_eval_rule-vm-runinnewcontext-injection, disabled in overrides.yaml in favour of this copy).
# Change: the request-handler context `function ($REQ, $RES, ...)` matched any
# function of two or more parameters, so `parse(text, opts)` was "a handler".
# Every handler context now also requires the parameters to be named as an
# HTTP handler names them: the request ^(req|request)$, the response ^(res|resp|response|reply|h)$.
# Search mode: the request name is written into the patterns, one branch per
# name, instead of a metavariable-regex: an unbound $REQ in a sink such as
# `$INP = <... $REQ ...>; ... $RE.test(<... $INP ...>)` matched every
# expression of every file and timed out on large ones.
rules:
- id: javascript.njsscan.eval.vm-runinnewcontext-injection
  pattern-either:
  - patterns:
    - pattern-inside: |
        require('vm')
        ...
    - pattern-either:
      - pattern-inside: function (req, $RES, ...) {...}
      - pattern-inside: function $FUNC(req, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(req, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(req, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(req, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $VM.runInNewContext($CODE,<... req.$QUERY.$FOO ...>,...)
      - pattern: |
          $CONTEXT = <... req.$QUERY.$FOO ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = {$NAME: <... req.$QUERY.$FOO ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = <... {$NAME:req.$QUERY.$FOO} ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $VAR = <... req.$QUERY.$FOO ...>;
          ...
          $CONTEXT = {$NAME: <... $VAR ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $VM.runInNewContext($CODE,<... req.$BODY ...>,...)
      - pattern: |
          $CONTEXT = <... req.$BODY ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = {$NAME: <... req.$BODY ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = <... {$NAME:req.$BODY} ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $VAR = <... req.$BODY ...>;
          ...
          $CONTEXT = {$NAME: <... $VAR ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  - patterns:
    - pattern-inside: |
        require('vm')
        ...
    - pattern-either:
      - pattern-inside: function (request, $RES, ...) {...}
      - pattern-inside: function $FUNC(request, $RES, ...) {...}
      - pattern-inside: $X = function $FUNC(request, $RES, ...) {...}
      - pattern-inside: var $X = function $FUNC(request, $RES, ...) {...};
      - pattern-inside: $APP.$METHOD(..., function $FUNC(request, $RES, ...) {...})
    - pattern-either:
      - pattern: |
          $VM.runInNewContext($CODE,<... request.$QUERY.$FOO ...>,...)
      - pattern: |
          $CONTEXT = <... request.$QUERY.$FOO ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = {$NAME: <... request.$QUERY.$FOO ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = <... {$NAME:request.$QUERY.$FOO} ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $VAR = <... request.$QUERY.$FOO ...>;
          ...
          $CONTEXT = {$NAME: <... $VAR ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $VM.runInNewContext($CODE,<... request.$BODY ...>,...)
      - pattern: |
          $CONTEXT = <... request.$BODY ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = {$NAME: <... request.$BODY ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $CONTEXT = <... {$NAME:request.$BODY} ...>;
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
      - pattern: |
          $VAR = <... request.$BODY ...>;
          ...
          $CONTEXT = {$NAME: <... $VAR ...>};
          ...
          $VM.runInNewContext($CODE,<... $CONTEXT ...>,...)
    - metavariable-regex:
        metavariable: $RES
        regex: ^(res|resp|response|reply|h)$
  message: |
    Untrusted user input in `vm.runInNewContext()` can result in code injection.
  severity: ERROR
  languages:
  - javascript
  metadata:
    cwe: CWE-94
    shortDescription: Improper control of generation of code (Code Injection)
    category: security
    owasp:
