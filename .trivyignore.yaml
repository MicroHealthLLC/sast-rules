# Trivy findings that are this repository's test data, not credentials or
# deployments. Each entry is scoped to the files named; the same check still
# reports anywhere else. Every value below was checked by hand: synthetic key
# IDs, truncated key bodies, JWTs signed "signature-not-real", and rule text
# that quotes the placeholder a rule looks for.
secrets:
  # Rule-test fixtures: deliberate `ruleid:` cases `opengrep scan --test` checks.
  - id: aws-access-key-id
    paths: [rules/microhealth/generic/aws-access-key-id.txt]
  - id: gcp-service-account
    paths: [rules/microhealth/generic/gcp-service-account-key.txt]
  - id: jwt-token
    paths: [rules/microhealth/generic/jwt-token.txt]
  - id: private-key
    paths: [rules/microhealth/generic/private-key.txt]
  # Rule text: comments and pattern-not placeholders that quote what a rule
  # matches (the GCP key-file type marker, a Stripe xxxx key, a Slack T00000000 hook).
  - id: gcp-service-account
    paths: [rules/microhealth/generic/gcp-service-account-key.yaml, overrides.yaml]
  - id: stripe-secret-token
    paths: [overrides.yaml, rules.lock.json]
  - id: slack-web-hook
    paths: [dist/internal.yaml, upstream/opengrep/generic/secrets/security/detected-slack-webhook.yaml]
misconfigurations:
