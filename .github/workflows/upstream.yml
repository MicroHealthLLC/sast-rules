name: Upstream updates
# Daily. Each kind of update gets its own pull request, so a reviewer reads one
# thing at a time. It targets `integration`, like every change (AI_RULES.md
# §1); `main` moves only from integration (ci.yml promote-main).
#   rules   GitLab's newest vX.Y.Z tag (scripts/sync_upstream.py), with the
#           rules added, changed, retired and relicensed listed in the PR
#   engine  the newest Opengrep release (scripts/bump_engine.py)
# FIPS image pins are NOT moved here: fips-base-images.yml owns them, and
# merges its bump at once (a stale FIPS image may never be released).
# No update may touch .github/workflows/: GitHub refuses a push of workflow
# files from an Actions token (GITHUB_TOKEN has no `workflows` permission),
# so data the bots move lives outside them. The job checks it before pushing.
# opengrep-rules is archived and frozen; it is never synced.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [rules, engine]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          # GH_PAT where it exists: a PR opened with GITHUB_TOKEN starts no CI.
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: SastRulesUpstream
          aws-region: ${{ vars.AWS_REGION_EAST_1 }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # aws-actions/amazon-ecr-login v2
        with:
          registries: "295669632222"
      - name: Update
        run: |
          case "${{ matrix.kind }}" in
            rules)  scripts/ci-run.sh python3 scripts/sync_upstream.py gitlab --summary "$RUNNER_TEMP/body.md" ;;
            engine) scripts/ci-run.sh python3 scripts/bump_engine.py | tee "$RUNNER_TEMP/body.md" ;;
          esac
          touch "$RUNNER_TEMP/body.md"
      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          # GH_PAT is an org secret shared with each repository. Without it
          # the job has only the Actions token, and this repository keeps
          # "Allow GitHub Actions to create and approve pull requests" off (it
          # would also let Actions approve one), so the token cannot open the
          # pull request: the branch is pushed and the run says where to open
          # it by hand. It can still refresh one that is already open; CI on
          # that refresh waits for a maintainer to approve the run.
          HAVE_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          branch="upstream/${{ matrix.kind }}"
          title="chore(${{ matrix.kind }}): upstream update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::This update changes workflow files, which an Actions token may not push. Move what it edits out of .github/workflows/ (as fips-images.json is for fips-base-images.yml)."
            git diff --cached --name-only; exit 1
          fi
          git commit -qm "$title"
          git push -f origin "$branch"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          elif [ "$HAVE_PAT" = true ]; then
            gh pr create --base integration --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/integration...${branch}?expand=1"
            echo "::warning title=Pull request not opened::GH_PAT is not shared with this repository and the Actions token may not open a pull request. ${branch} is pushed; open it against integration: ${url}"
            printf '\n**Pull request not opened:** GH_PAT is not shared with this repository. `%s` is pushed; [open it against integration](%s).\n' "$branch" "$url" >> "$GITHUB_STEP_SUMMARY"
          fi
