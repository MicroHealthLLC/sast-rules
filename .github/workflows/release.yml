name: Release
# Every push to main that changes what a scan runs (a bundle, the engine pin,
# a FIPS image pin or the shared workflow) becomes a release `vYYYY.MM.N`, with the bundles,
# SHA256SUMS and NOTICE attached. Consumers call the scan `@main`, so their
# next run takes it; a consumer that still pins a commit gets a pull request
# (consumers.yaml) moving its pin.
on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "engine.json"
      - "fips-images.json"
      - ".github/workflows/opengrep.yml"
      - ".github/workflows/trivy.yml"
      - ".github/workflows/zap.yml"
      - ".github/workflows/security-scan.yml"
      - "scripts/**"
      - "local/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # No release carries a stale MicroHealth FIPS image (owner's order,
  # 2026-10-22): the pins in fips-images.json must be the newest before a tag.
  fips-fresh:
    name: FIPS image pins are the newest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ECR digest lookup and the tools image pull
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: SastRulesReleaseFipsFresh
          aws-region: ${{ vars.AWS_REGION_EAST_1 }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # aws-actions/amazon-ecr-login v2
        with:
          registries: "295669632222"
      - name: Every FIPS pin is the newest digest of its tag
        run: scripts/ci-run.sh python3 scripts/fips_bump.py --check

  release:
    needs: fips-fresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and publish
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="v$(date -u +%Y).$(( 10#$(date -u +%m) ))"
          n="$(git tag -l "${prefix}.*" | wc -l)"
          tag="${prefix}.${n}"
          prev="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          {
            echo "Rules commit \`${GITHUB_SHA}\`. Opengrep $(jq -r .version engine.json)."
            echo
            echo "Bundles: $(jq -c .bundles rules.lock.json)"
            if [ -n "$prev" ]; then
              echo
              echo "Rule changes since ${prev}:"
              git show "${prev}:rules.lock.json" > "$RUNNER_TEMP/old.json"
              jq -rn --slurpfile o "$RUNNER_TEMP/old.json" --slurpfile n rules.lock.json '
                ($o[0].rules) as $a | ($n[0].rules) as $b |
                "- added: \([$b|keys[]|select($a[.]==null)]|length)",
                "- changed: \([$b|to_entries[]|select($a[.key]!=null and $a[.key].sha256!=.value.sha256)]|length)",
                "- retired or disabled: \([$b|to_entries[]|select(.value.status!="active" and ($a[.key].status//"active")=="active")]|length)"'
            fi
          } > "$RUNNER_TEMP/notes.md"
          # The engine's complete source for the pinned version travels with
          # the release (LGPL-2.1: whoever MicroHealth gives the binary to can
          # get its source from the same place), as do every license text.
          version="$(jq -r .version engine.json)"
          curl -fsSL -o "$RUNNER_TEMP/opengrep-${version}-source.tar.gz" \
            "https://github.com/opengrep/opengrep/archive/refs/tags/v${version}.tar.gz"
          tar -czf "$RUNNER_TEMP/licenses.tar.gz" -C dist licenses
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" dist/internal.yaml dist/product.yaml dist/SHA256SUMS dist/NOTICE.md \
            "$RUNNER_TEMP/licenses.tar.gz" "$RUNNER_TEMP/opengrep-${version}-source.tar.gz" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Open pin PRs in every consumer
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT is not available to this repository; consumers were not bumped. Run scripts/bump_consumers.sh ${{ steps.tag.outputs.tag }} $GITHUB_SHA with a token that can push to them."
            exit 0
          fi
          scripts/bump_consumers.sh "${{ steps.tag.outputs.tag }}" "$GITHUB_SHA"
