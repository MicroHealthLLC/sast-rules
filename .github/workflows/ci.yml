name: CI
# Every change: the bundles and the lock must be what the sources build, every
# rule in both bundles must load in the pinned Opengrep, MicroHealth's own
# rules must pass their tests, and the shared workflow must scan this
# repository end to end (no S3 upload). Before any of it, the FIPS image pins
# must be the newest (fips-fresh) and main may receive integration only
# (main-from-integration). A push to integration on which all of that passes
# is promoted to main (promote-main; owner's decision 2026-10-18).
on:
  pull_request:
  push:
    branches: [main, integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Before anything else, on every push to integration and main and every pull
  # request into main: no release may carry a stale MicroHealth FIPS image
  # (owner's order, 2026-10-22). A stale or unresolvable pin in
  # fips-images.json turns the run red, so nothing is validated or promoted
  # until fips-base-images.yml has merged the bump. Pull requests into
  # integration (the bump's own included) skip it; their push is checked.
  fips-fresh:
    name: FIPS image pins are the newest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ECR digest lookup and the tools image pull
      actions: write # dispatch fips-base-images.yml when a pin is stale
    steps:
      - id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          check=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ]; then check=false; fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.check == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - if: steps.scope.outputs.check == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: SastRulesFipsFresh
          aws-region: ${{ vars.AWS_REGION_EAST_1 }}
      - if: steps.scope.outputs.check == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # aws-actions/amazon-ecr-login v2
        with:
          registries: "295669632222"
      - name: Every FIPS pin is the newest digest of its tag
        if: steps.scope.outputs.check == 'true'
        run: scripts/ci-run.sh python3 scripts/fips_bump.py --check
      # fips-container moves dev-latest on every build, not only on the
      # releases that dispatch fips-base-images.yml, so a stale pin found here
      # starts the bump itself: it merges into integration, whose CI then
      # passes and promotes. A dispatch made with GITHUB_TOKEN does start a run.
      - name: Start the FIPS bump
        if: failure() && github.event_name == 'push' && steps.scope.outputs.check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fips-base-images.yml --repo "$GITHUB_REPOSITORY" --ref integration
          echo "A FIPS image pin is stale: fips-base-images.yml was dispatched; integration is promoted once its bump merges and CI passes." >> "$GITHUB_STEP_SUMMARY"

  # main receives integration only (AI_RULES.md §1): a pull request into main
  # must come from this repository's integration branch, and every non-merge
  # commit pushed to main must already be on integration.
  main-from-integration:
    name: main receives integration only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: A pull request into main comes from integration
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != integration ]; then
            echo "::error::main receives only integration from ${GITHUB_REPOSITORY}; this pull request is from ${HEAD_REPO}:${HEAD_REF}. Retarget it to integration."
            exit 1
          fi
          echo "From ${HEAD_REPO}:integration."
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit pushed to main is already on integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: scripts/require-from-integration.sh

  # promote-main fast-forwards integration to the merge it pushed to main;
  # that push is a commit main's own run validates, so it is not run twice.
  changes:
    name: Already validated on main?
    needs: [fips-fresh, main-from-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/integration ] \
            && git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            run=false
            echo "${GITHUB_SHA} is already on main; main's CI run validates it." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    name: Build check and rule tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ECR pull of the FIPS base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: SastRulesCi
          aws-region: ${{ vars.AWS_REGION_EAST_1 }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # aws-actions/amazon-ecr-login v2
        with:
          registries: "295669632222"
      - name: dist/ and rules.lock.json match the sources
        run: scripts/ci-run.sh python3 scripts/build.py --check
      - name: The shared workflow's controls and the status recorder
        run: scripts/ci-run.sh python3 -m unittest discover -s tests -v
      - name: Every rule loads, and our own rules pass their tests
        run: |
          version="$(jq -r .version engine.json)"; file="$(jq -r .assets.x86_64.file engine.json)"
          curl -fsSL -o "$RUNNER_TEMP/opengrep" "https://github.com/opengrep/opengrep/releases/download/v${version}/${file}"
          echo "$(jq -r .assets.x86_64.sha256 engine.json)  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/opengrep"
          mkdir -p "$RUNNER_TEMP/empty"; echo 'x = 1' > "$RUNNER_TEMP/empty/a.py"
          for b in internal product; do
            docker run --rm --network none -u "$(id -u)" -e HOME=/tmp \
              -v "$RUNNER_TEMP:/t" -v "$PWD:/repo:ro" -w /t/empty --entrypoint /t/opengrep sast-tools:fips \
              scan --config "/repo/dist/$b.yaml" --no-rewrite-rule-ids --json-output="/t/$b.json" --quiet .
            n="$(jq '.errors | length' "$RUNNER_TEMP/$b.json")"
            [ "$n" = 0 ] || { jq '.errors[:20]' "$RUNNER_TEMP/$b.json"; echo "::error::$n rule errors in $b"; exit 1; }
          done
          docker run --rm --network none -u "$(id -u)" -e HOME=/tmp \
            -v "$RUNNER_TEMP:/t" -v "$PWD:/repo:ro" -w /repo --entrypoint /t/opengrep sast-tools:fips \
            scan --test rules/microhealth
          # The refined upstream rules, as the bundle ships them, against tests/refine/.
          docker run --rm --network none -u "$(id -u)" -e HOME=/tmp -e OPENGREP=/t/opengrep \
            -v "$RUNNER_TEMP:/t" -v "$PWD:/repo" -w /repo --entrypoint python3 sast-tools:fips \
            tests/refine/run.py

  self-scan:
    name: Security scan, end to end
    needs: changes
    if: needs.changes.outputs.run == 'true'
    permissions: {contents: read, actions: read, security-events: write, id-token: write}
    uses: ./.github/workflows/security-scan.yml
    with:
      aws_region: ${{ vars.AWS_REGION_EAST_1 }}
      bundle: product
      # No deployment to attack: ZAP is recorded as not run, which is the
      # case the combined report must show honestly.
      zap_target: ""
    secrets: inherit

  # Integration only, and only when every job above passed. Pushes with this
  # repository's write deploy key (PROMOTE_DEPLOY_KEY): the only actor besides
  # admins that the main and integration rulesets let past their required
  # review, and a push that starts the release. Fork runs never receive it.
  promote-main:
    name: Promote integration to main
    needs: [changes, build, self-scan]
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/integration'
          && github.event_name != 'pull_request'
          && needs.changes.outputs.run == 'true'
          && needs.build.result == 'success'
          && needs.self-scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: promote-main
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Require the promotion deploy key
        env:
          HAVE_KEY: ${{ secrets.PROMOTE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" != true ]; then
            echo "::error::PROMOTE_DEPLOY_KEY is not set; main is protected, so the validated commit cannot be promoted"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
      - name: Merge into main and push
        env:
          PROMOTE_NOTE: "Build check, rule tests and the end-to-end scan passed in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/promote_main.sh "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
