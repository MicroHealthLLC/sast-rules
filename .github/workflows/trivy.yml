name: Trivy and SBOM
# Dependency vulnerabilities, secrets and misconfiguration (Trivy), and a
# CycloneDX SBOM, of a repository and optionally of container images. Called
# by security-scan.yml; it can be called on its own the same way.
#
#   * Trivy is MicroHealth's FIPS build: from source, on the FIPS Go image with
#     the Go Cryptographic Module (GOFIPS140, CMVP #5247), once per version by
#     engines.yml, and checked here against the sha256 engine.json records.
#     An upstream release binary would carry Go's non-validated crypto. It
#     runs on MicroHealth's FIPS Python image.
#   * Its vulnerability database is downloaded on every run (that is what
#     makes the scan current); nothing else is.
#   * Reports go where scripts/destination.sh says: the default branch's
#     to <project>/trivy-fs/… and <project>/sbom/…, where Tueri Core ingests
#     them; another branch's under _branch-scans/; a pull request's nowhere.
#   * Images are read by Trivy straight from the registry (--image-src
#     remote): one copy of the layers on disk, not a pulled image plus a
#     saved tarball, which a large image (CUDA, for one) does not fit. The
#     registry token reaches Trivy only through its environment, from a
#     mode-0600 env file, never a command line or a log.

on:
  workflow_call:
    inputs:
      project:
        description: "Tueri Core project (default: the repository name)"
        type: string
        default: ""
      aws_region:
        type: string
        required: true
      s3_bucket:
        description: "Evidence bucket; empty skips the upload"
        type: string
        default: ""
      ref:
        description: "Branch, tag or commit to scan (default: the triggering ref)"
        type: string
        default: ""
      sbom:
        description: "Also produce the CycloneDX SBOM"
        type: boolean
        default: true
      repository_scan:
        description: "Scan the repository's files (vulnerabilities, secrets, misconfiguration)"
        type: boolean
        default: true
      images:
        description: "Container images to scan too, one reference per line (e.g. <account>.dkr.ecr.<region>.amazonaws.com/app:dev-latest)"
        type: string
        default: ""
      image_registries:
        description: "ECR registry account ids the images live in, comma-separated (logged in with AWS_ROLE)"
        type: string
        default: ""
      runs_on:
        description: "Runner label for the Trivy jobs (a larger runner for very large images)"
        type: string
        default: ubuntu-latest
    secrets:
      AWS_ROLE:
        required: true
    outputs:
      targets:
        description: "Every target planned (JSON list of {kind, ref}); the combined report marks one that left no report as failed"
        value: ${{ jobs.plan.outputs.matrix }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          IMAGES: ${{ inputs.images }}
          REPO: ${{ inputs.repository_scan }}
        run: |
          {
            [ "$REPO" = true ] && echo '{"kind":"repo","ref":""}'
            printf '%s\n' "$IMAGES" | sed 's/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' \
              | jq -Rc '{kind:"image", ref:.}'
          } | jq -sc . > matrix.json || true
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Trivy targets: $(cat matrix.json)" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Trivy ${{ matrix.target.kind == 'repo' && 'repository' || matrix.target.ref }}
    needs: plan
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      S3_BUCKET: ${{ inputs.s3_bucket }}
      KIND: ${{ matrix.target.kind }}
      IMAGE_REF: ${{ matrix.target.ref }}
    steps:
      - name: Which sast-rules commit is running
        id: self
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The calling job must grant 'id-token: write' (see the README)."
            exit 1
          fi
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sast-rules" | jq -r .value)"
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          claims="$(printf '%s' "$payload" | base64 -d)"
          sha="$(printf '%s' "$claims" | jq -r .job_workflow_sha)"
          ref="$(printf '%s' "$claims" | jq -r .job_workflow_ref)"
          case "$sha" in (*[!0-9a-f]*|"") echo "::error::No job_workflow_sha in the OIDC token"; exit 1;; esac
          echo "repo=${ref%%/.github/workflows/*}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          path: src
          ref: ${{ inputs.ref }}

      - name: Checkout sast-rules (the commit this workflow runs at)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.sha }}
          path: .sast-rules
          persist-credentials: false

      - name: Where the reports go
        id: dest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          .sast-rules/scripts/destination.sh src
          project="${{ inputs.project }}"; project="${project:-${GITHUB_REPOSITORY##*/}}"
          name=""
          if [ "$KIND" = image ]; then
            # The image's repository name, as Tueri Core keys an image stream.
            name="$(printf '%s' "${IMAGE_REF##*/}" | sed 's/[:@].*//' | tr -c 'A-Za-z0-9._-' '-')"
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "artifact=trivy-${name:-repository}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActionsTrivy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to the FIPS base registry (ECR)
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # aws-actions/amazon-ecr-login v2
        with:
          registries: ${{ inputs.image_registries != '' && format('295669632222,{0}', inputs.image_registries) || '295669632222' }}

      # Trivy unpacks every layer of an image to scan it. A CUDA image does not
      # fit in the root disk a hosted runner leaves free (~14 GB), and the scan
      # failed with "no space left on device" on one run and passed on a rerun
      # depending on the VM. So, before anything is downloaded: on a
      # GitHub-hosted runner, an image scan deletes the preinstalled toolchains
      # this job never uses, and every scan puts its scratch space and cache on
      # whichever disk has the most room (a hosted runner's /mnt is ~70 GB). A
      # self-hosted runner is never cleaned: those directories are not ours.
      - name: Disk for the scan
        id: disk
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          df -h / /mnt "$RUNNER_TEMP" 2>/dev/null || true
          if [ "$HOSTED" = true ] && [ "$KIND" = image ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
            docker system prune -af >/dev/null 2>&1 || true
          fi
          avail() { k="$(df -Pk "$1" 2>/dev/null | awk 'NR==2 {print $4}')"; echo "${k:-0}"; }
          scratch="$RUNNER_TEMP/trivy-work"
          if [ "$HOSTED" = true ] && [ -d /mnt ] && [ "$(avail /mnt)" -gt "$(avail "$RUNNER_TEMP")" ]; then
            sudo mkdir -p /mnt/trivy-work && sudo chown "$(id -u):$(id -g)" /mnt/trivy-work && scratch=/mnt/trivy-work
          fi
          mkdir -p "$scratch/tmp" "$scratch/cache"
          echo "scratch=$scratch" >> "$GITHUB_OUTPUT"
          echo "Trivy scratch: $scratch ($(( $(avail "$scratch") / 1048576 )) GB free)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Trivy (the FIPS build engine.json pins)
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "::error::The FIPS Trivy build is linux/amd64 only"; exit 1; }
          url="$(jq -r .trivy.url .sast-rules/engine.json)"; sum="$(jq -r .trivy.sha256 .sast-rules/engine.json)"
          case "$sum" in (*[!0-9a-f]*|"") echo "::error::engine.json records no Trivy build"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy-bin/trivy" "$url"
          echo "${sum}  $RUNNER_TEMP/trivy-bin/trivy" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/trivy-bin/trivy"
          base="$(.sast-rules/scripts/fips-image.sh python)"
          docker build --build-arg BASE="$base" --build-arg APK_REFRESH=${{ github.run_id }} -t sast-trivy:fips -f - "$RUNNER_TEMP/trivy-bin" <<'DOCKERFILE'
          ARG BASE
          FROM ${BASE}
          # Per-run package refresh: a new value re-runs the layer below.
          ARG APK_REFRESH
          # git: Trivy reads the checkout; aws-cli uploads the reports. Root:
          # the scan writes into mounted runner directories; nothing ships.
          USER root
          RUN apk add --no-cache git aws-cli && apk upgrade --no-cache \
              && git config --system --add safe.directory '*'
          # Built from source on fips-go with GOFIPS140 by engines.yml, and
          # checked against engine.json's sha256 before this build.
          COPY trivy /usr/local/bin/trivy
          RUN trivy --version
          DOCKERFILE

      - name: Registry credential for the image (environment only)
        if: matrix.target.kind == 'image'
        run: |
          mkdir -p "$RUNNER_TEMP/img" && : > "$RUNNER_TEMP/img/env" && chmod 600 "$RUNNER_TEMP/img/env"
          host="${IMAGE_REF%%/*}"
          case "$host" in
            *.dkr.ecr.*.amazonaws.com)
              region="$(printf '%s' "$host" | sed -E 's/.*\.dkr\.ecr\.([a-z0-9-]+)\.amazonaws\.com/\1/')"
              pw="$(docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
                     --entrypoint aws sast-trivy:fips ecr get-login-password --region "$region")"
              echo "::add-mask::$pw"
              printf 'TRIVY_USERNAME=AWS\nTRIVY_PASSWORD=%s\n' "$pw" > "$RUNNER_TEMP/img/env" ;;
            *) echo "Not an ECR image: scanned anonymously." ;;
          esac

      - name: Run Trivy
        id: scan
        env:
          SBOM: ${{ inputs.sbom }}
          SCRATCH: ${{ steps.disk.outputs.scratch }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          common=(--cache-dir /cache --skip-version-check --no-progress --timeout 40m)
          envf=(); [ -s "$RUNNER_TEMP/img/env" ] && envf=(--env-file "$RUNNER_TEMP/img/env")
          run() { docker run --rm -e HOME=/tmp -e TMPDIR=/scratch "${envf[@]}" -v "$PWD/src:/src" \
                    -v "$SCRATCH/tmp:/scratch" \
                    -v "$out:/out" -v "$SCRATCH/cache:/cache" -w /src sast-trivy:fips trivy "$@"; }
          if [ "$KIND" = repo ]; then
            # .trivyignore.yaml can scope an ignore to paths; .trivyignore only to ids.
            ignore=()
            if [ -f src/.trivyignore.yaml ]; then ignore=(--ignorefile .trivyignore.yaml)
            elif [ -f src/.trivyignore ]; then ignore=(--ignorefile .trivyignore); fi
            run fs "${common[@]}" "${ignore[@]}" --format json --output /out/trivy-fs.json \
              --scanners vuln,secret,misconfig --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL .
            run convert --format sarif --output /out/trivy.sarif /out/trivy-fs.json
            [ "$SBOM" = true ] && run fs "${common[@]}" --format cyclonedx --output /out/sbom.cdx.json .
          else
            run image "${common[@]}" --image-src remote --format json --output /out/trivy-image.json \
              --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL "$IMAGE_REF"
            run convert --format sarif --output /out/trivy.sarif /out/trivy-image.json
            [ "$SBOM" = true ] && run image "${common[@]}" --image-src remote --format cyclonedx --output /out/sbom.cdx.json "$IMAGE_REF"
          fi
          rm -f "$RUNNER_TEMP/img/env"
          ls -la "$out"

      - name: Upload SARIF to GitHub code scanning
        if: always() && steps.scan.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # github/codeql-action/upload-sarif v4
        with:
          sarif_file: ${{ runner.temp }}/out/trivy.sarif
          category: ${{ steps.dest.outputs.artifact }}
          checkout_path: ${{ github.workspace }}/src

      # A fresh session for the upload: the one taken before the scan lasts an
      # hour, and a long scan outlived it ("ExpiredToken" on the S3 upload,
      # after a scan that had finished).
      - name: Refresh AWS credentials for the upload
        if: inputs.s3_bucket != '' && steps.dest.outputs.upload == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # aws-actions/configure-aws-credentials v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: GitHubActionsTrivyUpload
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload reports to S3
        if: inputs.s3_bucket != '' && steps.dest.outputs.upload == 'true'
        env:
          P: ${{ steps.dest.outputs.project }}/${{ steps.dest.outputs.base }}
          NAME: ${{ steps.dest.outputs.name }}
          META: commit=${{ steps.dest.outputs.commit }},branch=${{ steps.dest.outputs.branch }},run=${{ github.run_id }},rules=${{ steps.self.outputs.sha }}
        run: |
          day="$(date -u +%F)"; run="run-${GITHUB_RUN_ID}"
          put() { docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
                    -e AWS_DEFAULT_REGION="$AWS_REGION" -v "$RUNNER_TEMP/out:/data" -w /data \
                    --entrypoint aws sast-trivy:fips s3 cp "$1" "s3://${S3_BUCKET}/$2" \
                    --content-type application/json --metadata "$META"
                  echo "Uploaded s3://${S3_BUCKET}/$2" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [ "$KIND" = repo ]; then
            put trivy-fs.json "${P}trivy-fs/dt=${day}/${run}/trivy-fs.json"
            [ -s "$RUNNER_TEMP/out/sbom.cdx.json" ] && put sbom.cdx.json "${P}sbom/source/dt=${day}/${run}/${P%%/*}-source.cdx.json"
          else
            put trivy-image.json "${P}trivy-image/${NAME}/dt=${day}/${run}/trivy-${NAME}.json"
            [ -s "$RUNNER_TEMP/out/sbom.cdx.json" ] && put sbom.cdx.json "${P}sbom/image/${NAME}/dt=${day}/${run}/sbom-${NAME}.cdx.json"
          fi
          true

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: ${{ steps.dest.outputs.artifact }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 30
