# GitHub secret scanning: paths whose "secrets" are rule material, not secrets.
# - rules/microhealth/generic/*.txt: the test files of MicroHealth's secret
#   rules. Each `# ruleid:` line must hold a value shaped like a real
#   credential (fake: 1234567890:AAFq3..., AKIA...EXAMPLE) or the rule test
#   proves nothing, so GitHub's own patterns match them too (alert #2,
#   telegram_bot_token).
# - upstream/ and dist/: verbatim upstream rules and the bundles built from
#   them, whose patterns and examples quote credential shapes (alert #1,
#   slack_incoming_webhook_url).
# Every other path, including every rule's .yaml under rules/microhealth/, is
# still scanned, with push protection.
paths-ignore:
  - "rules/microhealth/generic/*.txt"
  - "upstream/**"
  - "dist/**"
